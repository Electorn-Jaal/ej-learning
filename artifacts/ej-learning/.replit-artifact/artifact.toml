kind = "web"
previewPath = "/"
title = "EJ Learning"
description = "A Mongolian-language adaptive learning application for students, teachers, and content administrators, centered on topic diagnostics, prerequisite support, daily learning work, and evidence-based progress."
version = "1.0.0"
id = "artifacts/ej-learning"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20369

[services.development]
run = "pnpm --filter @workspace/ej-learning run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ej-learning", "run", "build" ]
serve = "static"
publicDir = "artifacts/ej-learning/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20369"
BASE_PATH = "/"
