name: ej-ingress
services:
  acme:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./acme.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webroot:/var/www/acme:ro
    networks:
      tms:
        aliases: [ej-acme]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  tls:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['443:443']
    volumes:
      - ./tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/letsencrypt:ro
    networks: [ej, tms]
    logging: *logging
networks:
  tms:
    external: true
    name: diploma-system_default
  ej:
    external: true
    name: ej-learning_default
