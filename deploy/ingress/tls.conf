server {
    listen 443 ssl;
    server_name 116.206.83.75;
    ssl_certificate /etc/letsencrypt/live/ej-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ej-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location = /ej {
        absolute_redirect off;
        return 308 /ej/;
    }
    location ^~ /ej/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ej_backend http://web:80;
        proxy_pass $ej_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
