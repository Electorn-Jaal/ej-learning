map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name 116.206.83.75;
    ssl_certificate /etc/letsencrypt/live/ej-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ej-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location = /ej {
        absolute_redirect off;
        return 308 /ej/;
    }
    location ^~ /ej/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ej_backend http://web:80;
        proxy_pass $ej_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Preserve the existing TMS gateway's UI, API, uploads and SSE routing.
    location / {
        # Existing TMS bundles contain absolute HTTP API URLs.
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        client_max_body_size 30m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tms_backend http://diploma-system-nginx-1:80;
        proxy_pass $tms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_redirect http://116.206.83.75/ https://116.206.83.75/;
    }
}
