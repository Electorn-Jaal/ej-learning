name: ej-learning

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ej_learning
      POSTGRES_USER: ej_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ej_owner -d ej_learning"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    image: ${EJ_IMAGE_PREFIX:?Set image prefix}-api:${EJ_VERSION:?Set immutable release tag}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    environment: &app-env
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Set URL with URL-encoded password}
      EJ_STORAGE_DIR: /app/storage
    volumes:
      # Admin textbook uploads write here; only the API receives write access.
      - ${EJ_STORAGE_PATH:?Set absolute storage directory}:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  web:
    image: ${EJ_IMAGE_PREFIX:?Set image prefix}-web:${EJ_VERSION:?Set immutable release tag}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EJ_HTTP_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ej/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logging

  tools:
    image: ${EJ_IMAGE_PREFIX:?Set image prefix}-tools:${EJ_VERSION:?Set immutable release tag}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: tools
    profiles: [ops]
    environment: *app-env
    volumes:
      - ${EJ_STORAGE_PATH:?Set absolute storage directory}:/app/storage:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  postgres:
