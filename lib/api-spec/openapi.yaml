        "403":
          description: Not linked to a student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/homework/{homeworkId}:
    get:
      operationId: getMyHomeworkDetail
      tags: [student]
      summary: One piece of work and my own goes at it
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHomeworkDetail"
        "403":
          description: Not set for this child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/homework/{homeworkId}/submit:
    post:
      operationId: submitHomework
      tags: [student]
      summary: Hand work in
      description: >
        Every go is kept, so handing in again adds an attempt rather than
        replacing the last. Late is allowed and recorded; only work the teacher
        has withdrawn is refused.
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkSubmissionInput"
      responses:
        "201":
          description: Handed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkSubmitted"
        "400":
          description: Nothing written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not set for this child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The teacher has withdrawn it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/attendance:
    put:
      operationId: markAttendance
      tags: [teacher]
      summary: Take the register
      description: >
        Up to year 5 the class is with one teacher all day and the register is
        taken once, so timetableSlotId is left out. From year 6 the children
        move between teachers and it is taken per lesson, so it is required.
        The system holds the rule rather than trusting the screen to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResult"
        "400":
          description: A day that has not happened, a child not in the class, or the wrong kind of register for the year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/notebook:
    put:
      operationId: markNotebooks
      tags: [teacher]
      summary: Record what was found in a class's exercise books
      description: >
        The written half of the day's work. A child does the practice in their
        book; this is where the teacher says whether it was done, partly done,
        or not done, and adds the sentence that explains it.

        Not checked is not the same as not done. A period nobody looked at
        carries no marks at all, and the difference matters: a school that
        collapses the two will sooner or later tell a parent their child did
        nothing when the truth is that nobody looked. So UNCHECKED removes a
        mark rather than storing a fourth state, and children left out of the
        list keep whatever they had.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookInput"
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookResult"
        "400":
          description: A child who is not in the class, a bad state, or a day that has not happened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class or subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/schedule/replan:
    post:
      operationId: applyReplan
      tags: [teacher]
      summary: Approve the re-division of the rest of the term
      description: >
        The second half of a topic change. Setting a day's section says where
        the class is; this says that the days after it should follow from it.
        Until it is called the old plan stands, which is why the two are
        separate: a teacher who opens a topic to see whether it fits has not
        thereby rewritten their term.

        The plan is recomputed here from the same day and section rather than
        taken from the browser, so a tab left open overnight writes the plan
        that follows from the day as it now stands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanInput"
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplanResult"
        "400":
          description: Malformed day, or a date outside every term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class, or a day already taught
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials:
    get:
      operationId: getAdminMaterials
      tags: [admin]
      summary: Source materials with their file and outline state
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMaterial"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/skill-map:
    get:
      operationId: getSkillMap
      tags: [admin]
      summary: Which topics carry which skills, and what is missing
      description: >
        Read-only. Nothing in the product shows this mapping today, yet every
        lesson reaches its book pages through it and every mastery score is
        keyed on the skill it names. An import that lands the topics and the
        skills but drops the links between them leaves a system that can
        timetable lessons and cannot measure anything - and there is currently
        no way to see that has happened short of writing SQL.
      responses:
        "200":
          description: The mapping and its gaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMap"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/skill-chain:
    get:
      operationId: getSkillChain
      tags: [admin]
      summary: Which skill a skill depends on, and whether the chain works
      description: >
        Read-only. The remediation walk follows these links to decide what a
        struggling child should study instead, five levels back at most, and
        until now nothing in the product showed them. Three things about the
        chain are invisible and each breaks it silently: a link that is not
        REQUIRED and APPROVED is never followed, a prerequisite with no
        approved web-ready lesson ends the walk, and a cycle is only stopped by
        the depth limit - the database blocks a skill pointing at itself and
        nothing more.
      responses:
        "200":
          description: The chain, with the links that do nothing marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillChain"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials/{materialId}/file/{filename}:
    post:
      operationId: uploadMaterialFile
      tags: [admin]
      summary: Upload a textbook PDF as a new version of this material
      description: >
        The bytes are checked, not the filename: a file is accepted because it
        starts with %PDF-. Versions are added rather than replaced, because
        outline rows and lesson alignments were made against the page numbers
        of the file already stored. The page offset is set separately, since it
        is nearly always discovered after looking at the book.
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
        - name: filename
          in: path
          required: true
          description: >
            The original name, recorded as a column. It never becomes part of a
            path on disk - the stored file is named from the material's own
            source_code.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Not a PDF, empty, or no such material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials/{materialId}/page-offset:
    put:
      operationId: setMaterialPageOffset
      tags: [admin]
      summary: Correct the gap between printed and file page numbers
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageOffsetInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOffsetInput"
        "400":
          description: No file uploaded for this material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials/{materialId}/outline:
    get:
      operationId: getMaterialOutline
      tags: [admin]
      summary: A material's sections and page mapping
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialOutline"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveMaterialOutline
      tags: [admin]
      summary: Save the sections and the printed-to-file page offset
      description: >
        Sections are matched on outlineCode: known codes are updated, new ones
        inserted. Nothing is deleted here, because a section can already be
        aligned to content and to lessons, and silently dropping it would
        leave those pointing at nothing.
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialOutlineInput"
      responses:
        "200":
          description: Saved outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialOutline"
        "400":
          description: A page range outside the file, or a duplicate code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/assignments:
    post:
      operationId: assignExtraWork
      tags: [teacher]
      summary: Give one student extra work on a day
      description: >
        Recorded as a TEACHER assignment rather than an AUTO one, so the
        algorithm that will later place remediation itself can be told to leave
        a teacher's choice alone. One assignment per student per day: assigning
        again replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtraWorkInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraWorkResult"
        "400":
          description: A lesson the student's class cannot be taught, or a bad date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that student's class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /term/current:
    get:
      operationId: getCurrentTerm
      tags: [session]
      summary: The term today falls in
      description: >
        Read from learning.terms rather than worked out from the month: the
        school sets its own term boundaries each year and they move. Null when
        today falls outside every recorded term, which is what a holiday
        between terms looks like, and what an unseeded database looks like too.
      responses:
        "200":
          description: The term, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Term"
                  - type: "null"
  /student/subject-outline:
    get:
      operationId: getStudentSubjectOutline
      tags: [student]
      summary: One subject's whole book, with the class's place in it marked
      parameters:
        - name: subject
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: >-
            Every section in book order, each flagged as done, current or to
            come. Empty when the class studies no such subject, or its book
            has no outline imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectOutline"
  /school/periods:
    get:
      operationId: getSchoolPeriods
      tags: [student]
      summary: The school's bell times for the current year
      responses:
        "200":
          description: Periods in order, empty when none are recorded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolPeriod"
  /student/plan:
    get:
      operationId: getStudentPlan
      tags: [student]
      summary: What this student wrote for themselves for a day
      description: >
        The child's own plan, which is not the school's work. Free text and
        private to them: no teacher endpoint reads this, and none should until
        somebody decides a teacher ought to see it.
      parameters:
        - name: date
          in: query
          required: false
          description: Defaults to today in Ulaanbaatar.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: The plan, empty when nothing has been written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPlan"
        "400":
          description: A date that is not a date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveStudentPlan
      tags: [student]
      summary: Write or replace a day's plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentPlanInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPlan"
        "400":
          description: A bad date, or more text than the column takes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/quiz/{lessonId}:
    get:
      operationId: getQuizPaper
      tags: [student]
      summary: The questions for a lesson, without the answers
      description: >
        The key is never sent. It used to live in the frontend bundle, where
        any student could read it, and it stays on the server now so that a
        score means something.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizPaper"
        "403":
          description: A lesson this student is not assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
  schemas:
    DiagnosticTargetsInput:
      type: object
      required: [mapIds]
      properties:
        mapIds: {type: array, maxItems: 100, uniqueItems: true, items: {type: integer, minimum: 1}}
    DiagnosticSaved:
      type: object
      required: [id]
      properties:
        id: {type: integer}
    DiagnosticTarget:
      type: object
      required: [mapId, topicId, topicName, skillId, skillName]
      properties:
        mapId: {type: integer}
        topicId: {type: integer}
        topicName: {type: string}
        skillId: {type: integer}
        skillName: {type: string}
    DiagnosticResourceInput:
      type: object
      required: [title, kind, instructions, mapIds]
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        kind: {type: string, enum: [CORE, SUPPLEMENT, EXERCISE, QUESTION]}
        instructions: {type: string, minLength: 1, maxLength: 10000}
        sourceMaterialId: {type: integer, minimum: 1, nullable: true}
        reference: {type: string, maxLength: 500, nullable: true}
        mapIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: integer, minimum: 1}}
    DiagnosticResource:
      allOf:
        - {$ref: '#/components/schemas/DiagnosticResourceInput'}
        - type: object
          required: [id, sourceTitle]
          properties:
            id: {type: integer}
            sourceTitle: {type: string, nullable: true}
    DiagnosticCatalog:
      type: object
      required: [targets, items, resources, sources]
      properties:
        targets: {type: array, items: {$ref: '#/components/schemas/DiagnosticTarget'}}
        items:
          type: array
          items:
            type: object
            required: [id, title, mapIds]
            properties:
              id: {type: integer}
              title: {type: string}
              mapIds: {type: array, items: {type: integer}}
        resources: {type: array, items: {$ref: '#/components/schemas/DiagnosticResource'}}
        sources:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: {type: integer}
              title: {type: string}
    DiagnosticEvidence:
      type: object
      required: [itemId, title, awarded, maxScore, targets]
      properties:
        itemId: {type: integer}
        title: {type: string}
        awarded: {type: number}
        maxScore: {type: number}
        targets: {type: array, items: {$ref: '#/components/schemas/DiagnosticTarget'}}
    DiagnosticPlanEntry:
      type: object
      required: [mapId, resourceId, title, instructions]
      properties:
        mapId: {type: integer, minimum: 1}
        resourceId: {type: integer, minimum: 1, nullable: true}
        title: {type: string, minLength: 1, maxLength: 500}
        instructions: {type: string, minLength: 1, maxLength: 10000}
    DiagnosticReviewInput:
      type: object
      required: [revision, entries, note, published]
      properties:
        revision: {type: integer, minimum: 0}
        entries: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DiagnosticPlanEntry'}}
        note: {type: string, maxLength: 10000}
        published: {type: boolean, description: "Shown to the child and their guardian. False keeps it the teacher's draft."}
    DiagnosticReport:
      type: object
      required: [attemptId, classId, subjectId, studentName, title, evidence, resources, revision, entries, note, updatedAt, publishedAt]
      properties:
        attemptId: {type: integer}
        classId: {type: integer}
        subjectId: {type: integer}
        studentName: {type: string}
        title: {type: string}
        evidence: {type: array, items: {$ref: '#/components/schemas/DiagnosticEvidence'}}
        resources: {type: array, items: {$ref: '#/components/schemas/DiagnosticResource'}}
        revision: {type: integer}
        entries: {type: array, items: {$ref: '#/components/schemas/DiagnosticPlanEntry'}}
        note: {type: string}
        updatedAt: {type: string, nullable: true}
        publishedAt: {type: string, nullable: true}
    PublishedDiagnosticPlan:
      type: object
      required: [attemptId, title, subjectName, teacherName, publishedAt, note, entries]
      properties:
        attemptId: {type: integer}
        title: {type: string, description: The diagnostic paper the plan answers}
        subjectName: {type: string}
        teacherName: {type: string, nullable: true}
        publishedAt: {type: string}
        note: {type: string}
        entries:
          type: array
          items:
            type: object
            required: [title, instructions, topicName, skillName, resourceTitle, sourceMaterialId]
            properties:
              title: {type: string}
              instructions: {type: string}
              topicName: {type: string, nullable: true}
              skillName: {type: string, nullable: true}
              resourceTitle: {type: string, nullable: true}
              sourceMaterialId: {type: integer, nullable: true}
    EnrollmentClass:
      type: object
      required: [classId, name, gradeLevel, schoolYear, classTeacherId, classTeacherName, students]
      properties:
        classId: {type: integer}
        name: {type: string}
        gradeLevel: {type: integer}
        schoolYear: {type: string}
        classTeacherId: {type: integer, nullable: true}
        classTeacherName: {type: string, nullable: true}
        students: {type: integer}
    EnrollmentOverview:
      type: object
      required: [classes, teachers, schoolYears]
      properties:
        classes: {type: array, items: {$ref: '#/components/schemas/EnrollmentClass'}}
        teachers:
          type: array
          items:
            type: object
            required: [teacherId, name]
            properties:
              teacherId: {type: integer}
              name: {type: string}
        schoolYears: {type: array, items: {type: string}}
    EnrollmentStudent:
      type: object
      required: [studentId, studentCode, name, classId, className]
      properties:
        studentId: {type: integer}
        studentCode: {type: string}
        name: {type: string}
        classId: {type: integer, nullable: true}
        className: {type: string, nullable: true}
    TransferInput:
      type: object
      required: [studentId, toClassId, effectiveOn, reason]
      properties:
        studentId: {type: integer, minimum: 1}
        toClassId: {type: integer, minimum: 1}
        effectiveOn: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        reason: {type: string, maxLength: 1000}
    ClassTeacherInput:
      type: object
      required: [classId, teacherId, effectiveOn]
      properties:
        classId: {type: integer, minimum: 1}
        teacherId: {type: integer, minimum: 1, nullable: true}
        effectiveOn: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    EnrollmentChange:
      type: object
      required: [id, kind, studentId, studentName, fromClass, toClass, effectiveOn, reason, changedBy, changedAt]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [TRANSFER, PROMOTE, REPEAT, GRADUATE]}
        studentId: {type: integer}
        studentName: {type: string}
        fromClass: {type: string, nullable: true}
        toClass: {type: string, nullable: true}
        effectiveOn: {type: string}
        reason: {type: string}
        changedBy: {type: string, nullable: true}
        changedAt: {type: string}
    PromotionRow:
      type: object
      required: [studentId, name, fromClass, gradeLevel, proposed, toClass]
      properties:
        studentId: {type: integer}
        name: {type: string}
        fromClass: {type: string}
        gradeLevel: {type: integer}
        proposed: {type: string, enum: [PROMOTE, GRADUATE, MANUAL]}
        toClass: {type: string, nullable: true, description: The next year's class name for PROMOTE}
    PromotionPreview:
      type: object
      required: [fromYear, toYear, rows, newClasses]
      properties:
        fromYear: {type: string}
        toYear: {type: string}
        rows: {type: array, items: {$ref: '#/components/schemas/PromotionRow'}}
        newClasses: {type: array, items: {type: string}, description: Next-year classes that do not exist yet and would be created}
    PromotionInput:
      type: object
      required: [fromYear, effectiveOn, decisions]
      properties:
        fromYear: {type: string, pattern: '^\d{4}-\d{4}$'}
        effectiveOn: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        decisions:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [studentId, action]
            properties:
              studentId: {type: integer, minimum: 1}
              action: {type: string, enum: [PROMOTE, REPEAT, GRADUATE, SKIP]}
    PromotionResult:
      type: object
      required: [toYear, promoted, repeated, graduated, skipped, createdClasses]
      properties:
        toYear: {type: string}
        promoted: {type: integer}
        repeated: {type: integer}
        graduated: {type: integer}
        skipped: {type: integer}
        createdClasses: {type: array, items: {type: string}}
    LibraryBook:
      type: object
      required: [id, title, subjectName, grades, hasFile, hasCover, filePages]
      properties:
        id: {type: integer}
        title: {type: string}
        subjectName: {type: string}
        grades:
          type: array
          items: {type: integer}
        hasFile: {type: boolean}
        hasCover: {type: boolean}
        filePages: {type: [integer, "null"]}
    TimetableStudentsInput:
      type: object
      properties:
        studentIds:
          type: array
          uniqueItems: true
          items: {type: integer, minimum: 1}
      required: [studentIds]
    TimetableStudents:
      type: object
      properties:
        assigned: {type: boolean}
        students:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              selected: {type: boolean}
            required: [id, name, selected]
      required: [assigned, students]

    ExtraWork:
      type: object
      properties:
        lesson:
          $ref: "#/components/schemas/DailyLessonView"
        source:
          type: string
          enum: [AUTO, TEACHER]
        reason:
          type: ["string", "null"]
      required: [lesson, source, reason]
    ExtraWorkInput:
      type: object
      properties:
        studentId:
          type: integer
        lessonId:
          type: integer
        assignedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reason:
          type: ["string", "null"]
      required: [studentId, lessonId, assignedOn, reason]
    ExtraWorkResult:
      type: object
      properties:
        studentName:
          type: string
        lessonCode:
          type: string
        skillName:
          type: string
        assignedOn:
          type: string
      required: [studentName, lessonCode, skillName, assignedOn]
    UploadedFile:
      type: object
      properties:
        materialId:
          type: integer
        versionNo:
          type: integer
        filename:
          type: string
        sizeBytes:
          type: integer
        totalPages:
          description: Counted from the file, approximate. The outline is what page numbers are read from.
          type: ["integer", "null"]
        pageOffset:
          type: integer
      required: [materialId, versionNo, filename, sizeBytes, totalPages, pageOffset]
    PageOffsetInput:
      type: object
      properties:
        materialId:
          type: integer
        pageOffset:
          type: integer
      required: [materialId, pageOffset]
    SkillChainLink:
      type: object
      properties:
        dependencyCode:
          type: string
        skillCode:
          type: string
        skillName:
          type: string
        prerequisiteCode:
          type: string
        prerequisiteName:
          type: string
        subjectName:
          type: string
        relationType:
          description: >
            REQUIRED or RECOMMENDED. Only REQUIRED is walked; a RECOMMENDED
            link is a note for whoever plans a year.
          type: string
        importance:
          description: Recorded, but the remediation walk does not read it.
          type: string
        status:
          type: string
        reason:
          description: Why this prerequisite. The column is NOT NULL, so there is always one.
          type: string
        followed:
          description: >
            True when this link is both APPROVED and REQUIRED - that is, when
            remediation actually walks it. Everything else is documentation.
          type: boolean
        prerequisiteHasLesson:
          description: >
            Whether the prerequisite has an approved, web-ready lesson. Without
            one the walk reaches a dead end and keeps looking further back.
          type: boolean
      required:
        - dependencyCode
        - skillCode
        - skillName
        - prerequisiteCode
        - prerequisiteName
        - subjectName
        - relationType
        - importance
        - status
        - reason
        - followed
        - prerequisiteHasLesson
    SkillChain:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/SkillChainLink"
        cycles:
          description: >
            Loops among the followed links, each given as the skill codes
            around it. The database only forbids a skill pointing at itself, so
            a two-step loop is possible; the walk survives it on the depth
            limit alone and returns nonsense.
          type: array
          items:
            type: array
            items:
              type: string
      required: [links, cycles]
    SkillMapSkill:
      type: object
      properties:
        skillCode:
          type: string
        name:
          type: string
        status:
          description: The skill's own review status. Only APPROVED skills reach a student.
          type: string
        isPrimary:
          description: >
            The one skill a topic is mainly about. It decides which book pages
            open with the lesson, so a topic carrying two of them is a fault
            even though the database permits it.
          type: boolean
        mapStatus:
          description: >
            The link's own review status, separate from the skill's. Anything
            but APPROVED is invisible to students.
          type: string
        lessonCount:
          type: integer
      required: [skillCode, name, status, isPrimary, mapStatus, lessonCount]
    SkillMapNode:
      type: object
      properties:
        contentCode:
          type: string
        name:
          type: string
        levelType:
          description: DOMAIN, UNIT, TOPIC, SUBTOPIC or SEGMENT.
          type: string
        subjectName:
          type: string
        status:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillMapSkill"
      required: [contentCode, name, levelType, subjectName, status, skills]
    SkillMapOrphanSkill:
      type: object
      properties:
        skillCode:
          type: string
        name:
          type: string
        subjectName:
          type: string
        status:
          type: string
        lessonCount:
          description: >
            Lessons written against a skill no topic carries. They can be
            taught, but nothing will find them a page in a book.
          type: integer
      required: [skillCode, name, subjectName, status, lessonCount]
    SkillMap:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/SkillMapNode"
        unmappedSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillMapOrphanSkill"
      required: [nodes, unmappedSkills]
    AdminMaterial:
      type: object
      properties:
        id:
          type: integer
        sourceCode:
          type: string
        title:
          type: ["string", "null"]
        subjectName:
          type: string
        status:
          type: string
        hasFile:
          type: boolean
        filePages:
          type: ["integer", "null"]
        pageOffset:
          type: integer
        sectionCount:
          type: integer
      required:
        - id
        - sourceCode
        - title
        - subjectName
        - status
        - hasFile
        - filePages
        - pageOffset
        - sectionCount
    OutlineSection:
      type: object
      properties:
        id:
          type: ["integer", "null"]
        outlineCode:
          type: string
        printedNumber:
          type: ["string", "null"]
        title:
          type: string
        pageFrom:
          type: ["integer", "null"]
        pageTo:
          type: ["integer", "null"]
        sequenceNo:
          type: integer
        planningPeriodNo:
          type: ["integer", "null"]
          minimum: 1
        usedByLessons:
          description: How many lessons point at this section. Above zero means editing it moves real work.
          type: integer
      required:
        - id
        - outlineCode
        - printedNumber
        - title
        - pageFrom
        - pageTo
        - sequenceNo
        - planningPeriodNo
        - usedByLessons
    MaterialOutline:
      type: object
      properties:
        materialId:
          type: integer
        title:
          type: ["string", "null"]
        pageOffset:
          type: integer
        filePages:
          type: ["integer", "null"]
        planningPeriodCount:
          description: Number of planning periods for this material; not globally fixed to three.
          type: ["integer", "null"]
          minimum: 1
          maximum: 12
        sections:
          type: array
          items:
            $ref: "#/components/schemas/OutlineSection"
      required: [materialId, title, pageOffset, filePages, planningPeriodCount, sections]
    MaterialOutlineInput:
      type: object
      properties:
        pageOffset:
          type: integer
          minimum: 0
        planningPeriodCount:
          type: ["integer", "null"]
          minimum: 1
          maximum: 12
        sections:
          type: array
          items:
            type: object
            properties:
              outlineCode:
                type: string
                minLength: 1
              printedNumber:
                type: ["string", "null"]
              title:
                type: string
                minLength: 1
              pageFrom:
                type: ["integer", "null"]
              pageTo:
                type: ["integer", "null"]
              sequenceNo:
                type: integer
              planningPeriodNo:
                type: ["integer", "null"]
                minimum: 1
                maximum: 12
            required: [outlineCode, printedNumber, title, pageFrom, pageTo, sequenceNo, planningPeriodNo]
      required: [pageOffset, planningPeriodCount, sections]
    SchedulableLesson:
      type: object
      properties:
        id:
          type: integer
        lessonCode:
          type: string
        lessonType:
          type: string
        skillName:
          type: string
        chapterTitle:
          type: ["string", "null"]
        pageFrom:
          type: ["integer", "null"]
      required: [id, lessonCode, lessonType, skillName, chapterTitle, pageFrom]
    GenerateScheduleInput:
      type: object
      properties:
        classId:
          type: integer
        subjectId:
          type: ["integer", "null"]
          description: >
            Lay out one subject's term. Null means every subject the teacher
            holds in this class.
        termId:
          description: >
            Which term to lay out. Omit it for the term today falls in, which
            is what a teacher pressing the button means.
          type: ["integer", "null"]
      required: [classId]
    GenerateScheduleResult:
      type: object
      properties:
        created:
          type: integer
        skipped:
          description: School days that already carried a lesson and were left alone.
          type: integer
        lessonsAvailable:
          type: integer
        firstDay:
          type: ["string", "null"]
        lastDay:
          type: ["string", "null"]
        notice:
          type: string
      required: [created, skipped, lessonsAvailable, firstDay, lastDay, notice]
    ReplanDay:
      type: object
      description: One day the re-division would change, and what it holds now.
      required: [scheduledOn, lessonId, lessonCode, skillName]
      properties:
        scheduledOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        periodNo:
          type: [integer, "null"]
        lessonId:
          type: integer
        lessonCode:
          type: string
        skillName:
          type: string
        chapterTitle:
          type: [string, "null"]
        currentLessonCode:
          description: What stands there now; null where the day is empty.
          type: [string, "null"]
        currentSkillName:
          type: [string, "null"]
    ReplanProposal:
      type: object
      description: >
        What the rest of the term would become. Nothing has been written: these
        are the days that would move if the teacher approves, and only the ones
        that would actually change.
      required: [classId, subjectId, fromDate, days]
      properties:
        classId:
          type: integer
        subjectId:
          type: integer
        fromDate:
          description: >
            The day the class is now known to have reached. The plan is worked
            out from what this class has been through on or before it, not from
            any one section, so approving it needs nothing else.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        days:
          type: array
          items:
            $ref: "#/components/schemas/ReplanDay"
    ScheduleDayResult:
      type: object
      required: [replan]
      properties:
        replan:
          description: Null when nothing later would change.
          oneOf:
            - $ref: "#/components/schemas/ReplanProposal"
            - type: "null"
    ReplanInput:
      type: object
      required: [classId, subjectId, fromDate]
      properties:
        classId:
          type: integer
        subjectId:
          type: integer
        fromDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    ReplanResult:
      type: object
      required: [days]
      properties:
        days:
          description: How many periods were written.
          type: integer
    ScheduleDayInput:
      type: object
      properties:
        timetableSlotId:
          type: [integer, "null"]
          minimum: 1

        classId:
          type: integer
        subjectId:
          type: ["integer", "null"]
          description: >
            Which subject's day this is. Setting a lesson takes the subject
            from the lesson itself, so this only matters when clearing: without
            it, emptying Tuesday in the maths timetable would also empty
            Tuesday's physics. Null clears every subject the teacher holds in
            the class.
        scheduledOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        lessonId:
          description: null clears the day.
          type: ["integer", "null"]
        quizOpensAt:
          description: >
            HH:MM, in the school's own time, before which the day's check
            cannot be sat. Null - nearly always - means it is open as soon as
            the day is. A teacher holding it back until the practice is done
            sets a time here.
          type: ["string", "null"]
          pattern: '^\d{2}:\d{2}$'
        quizQuestionCount:
          description: >
            How many questions the check asks. Null means the system's five.
          type: ["integer", "null"]
          minimum: 1
          maximum: 50
        quizAttempts:
          description: >
            How many goes a child gets in a day. Null means the system's three.
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        answersOpenAt:
          description: >
            When the key and the marking notes become the child's to see. Null
            is "not yet", and that is where a check sits while it is still
            being sat: three goes are pointless if the first hands over the
            answer, and a parent reading over a shoulder is how it would
            travel. Whether each answer was right is told at once regardless.

            An ISO 8601 instant. Sending "now" is the ordinary case; a later
            one schedules the release.
          type: ["string", "null"]
        held:
          description: >
            Whether the lesson actually happened. True unless said otherwise,
            and that default is the point: a teacher who marks nothing has not
            said the class was cancelled, and reading silence as cancellation
            would strike off every day nobody got round to entering. A false
            here needs notHeldReason, covers no section - so the section falls
            back into the plan and the class gets it another day - and leaves
            the child with no material and no check for that period.
          type: boolean
        notHeldReason:
          description: >
            Why the lesson did not happen. Required when held is false; it is
            the thing a parent asks about, and "the system says nothing
            happened" is not an answer three weeks later.
          type: ["string", "null"]
          maxLength: 2000
        isContinuation:
          description: >
            The period carried the previous one on rather than opening a new
            section. It consumes no section from the plan, and reads
            differently to a child: pick the book up, do not start it.
          type: boolean
        coveredLessonIds:
          description: >
            Every section this period actually got through, including the one
            in lessonId. A teacher who moves the class on from section 4 to
            section 5 is saying one of two things and the day alone cannot tell
            them apart: we did 4 and started 5, or we skipped 4 and will come
            back to it. This is where they say which.

            Left out, the answer is "just the one in lessonId". That is the
            safe reading: a section wrongly thought untaught comes back round,
            while one wrongly thought taught is never seen again. Clearing the
            day clears this with it.
          type: ["array", "null"]
          items:
            type: integer
            minimum: 1
        note:
          description: >
            What the teacher wants the class to know about this day - which
            pages to read, which exercises to do, what to watch out for. The
            student sees it. Leave the field out to keep whatever note is
            already there; send null or an empty string to remove it. Clearing
            the day removes the note with it.
          type: ["string", "null"]
          maxLength: 2000
        pageFrom:
          description: >
            The pages this class actually covered, when they are not the ones
            the book prints for the section. Leave both out to keep whatever is
            recorded; send null to fall back to the book's own range. A class
            that went further than the section is the reason this exists, and a
            teacher setting it changes nothing for any other class.
          type: ["integer", "null"]
          minimum: 1
        pageTo:
          type: ["integer", "null"]
          minimum: 1
      required: [classId, scheduledOn, lessonId]
    QuizOption:
      type: object
      properties:
        optionId:
          type: integer
        text:
          type: string
      required: [optionId, text]
    QuizQuestion:
      type: object
      properties:
        itemId:
          type: integer
        prompt:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuizOption"
      required: [itemId, prompt, options]
    Term:
      type: object
      properties:
        schoolYear:
          type: string
        termNumber:
          type: integer
        name:
          type: string
        startsOn:
          type: string
        endsOn:
          type: string
      required: [schoolYear, termNumber, name, startsOn, endsOn]
    StudentPlan:
      type: object
      properties:
        date:
          type: string
        body:
          description: Empty string when the day has no plan; there is no separate null.
          type: string
      required: [date, body]
    StudentPlanInput:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        body:
          description: Blank or whitespace removes the day's plan.
          type: string
          maxLength: 2000
      required: [date, body]
    QuizPaper:
      type: object
      properties:
        lessonId:
          type: integer
        lessonCode:
          type: string
        skillName:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        kind:
          description: >
            Which sort of assessment this is - the check at the end of a
            lesson, a unit test, a monthly one, a diagnostic. Recorded against
            the lesson that carries the questions; it is not yet an assessment
            of its own, with an owner and a window.
          type: string
          enum: [LESSON, UNIT, MONTHLY, DIAGNOSTIC]
        attemptsUsed:
          description: >
            How many times this student has sat this quiz today. The daily
            check is practice rather than an examination: a child who gets one
            wrong should be able to think again and try, so there are three
            goes and a retry draws questions they have not seen where the
            lesson has enough of them.
          type: integer
        opensAt:
          description: >
            HH:MM before which this check cannot be sat, or null where it is
            open all day. Told rather than hidden: a page with nothing on it
            reads as broken.
          type: ["string", "null"]
        isOpen:
          description: False while the check is still waiting for its hour. The questions are then empty.
          type: boolean
        answersOpen:
          description: >
            Whether the teacher has released the key. Until they have, a marked
            paper says which answers were right or wrong and no more.
          type: boolean
        attemptsAllowed:
          type: integer
        lastScore:
          type: ["integer", "null"]
        lastMaxScore:
          type: ["integer", "null"]
      required:
        - lessonId
        - lessonCode
        - skillName
        - questions
        - kind
        - attemptsUsed
        - attemptsAllowed
        - lastScore
        - lastMaxScore
    TeacherCard:
