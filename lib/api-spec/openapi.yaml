          type: string
        closesAt:
          type: string
        itemIds:
          description: Questions the teacher insists on. Asked first; the draw fills the rest.
          type: ["array", "null"]
          items: { type: integer }
        drawCount:
          description: How many further questions to draw at random from the year's bank.
