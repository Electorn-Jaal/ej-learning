openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EJ Learning adaptive learning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sign-in and the current session
  - name: content
    description: Source materials and their files
  - name: admin
    description: Configuration a school administrator owns
  - name: session
    description: Current authenticated identity
  - name: student
    description: Student learning journey
  - name: teacher
    description: Teacher classroom and review workflow
paths:
  /teacher/diagnostic-catalog:
    get:
      operationId: getDiagnosticCatalog
      tags: [teacher]
      parameters:
        - {name: classId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: subjectId, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        default:
          description: Validation, access, missing record, or revision conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Explicit topic and skill pairs, questions, and study resources
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticCatalog'}
  /admin/diagnostic-items/{itemId}/targets:
    put:
      operationId: setDiagnosticItemTargets
      tags: [admin]
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticTargetsInput'}
      responses:
        default:
          description: Validation, access, missing record, or revision conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Mapping saved; existing review snapshots remain unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticSaved'}
  /admin/diagnostic-resources:
    post:
      operationId: createDiagnosticResource
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticResourceInput'}
      responses:
        default:
          description: Validation, access, missing record, or revision conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "201":
          description: Resource with explicit targets created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticSaved'}
  /teacher/diagnostic-attempts/{attemptId}:
    get:
      operationId: getDiagnosticReport
      tags: [teacher]
      parameters:
        - {name: attemptId, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        default:
          description: Validation, access, missing record, or revision conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Question evidence and teacher draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticReport'}
    put:
      operationId: saveDiagnosticReview
      tags: [teacher]
      parameters:
        - {name: attemptId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticReviewInput'}
      responses:
        default:
          description: Validation, access, missing record, or revision conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Teacher draft saved using optimistic concurrency
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticReport'}
  /student/diagnostic-plans:
    get:
      operationId: getStudentDiagnosticPlans
      tags: [student]
      summary: Personal study plans a teacher made from this child's diagnostic and chose to show
      responses:
        default:
          description: Not a student account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Published plans only; a teacher's draft stays with the teacher
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PublishedDiagnosticPlan'}
  /guardian/diagnostic-plans:
    get:
      operationId: getChildDiagnosticPlans
      tags: [guardian]
      summary: The same published plans, for a parent's own child (FR20)
      parameters:
        - {name: studentId, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        default:
          description: Not this parent's child
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Published plans only
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PublishedDiagnosticPlan'}
  /admin/enrollment:
    get:
      operationId: getEnrollmentOverview
      tags: [admin]
      summary: Active classes with their class teacher, and the staff who could be one
      responses:
        default:
          description: Validation, access or a missing record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Classes and teachers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentOverview'}
  /admin/enrollment/students:
    get:
      operationId: searchEnrollmentStudents
      tags: [admin]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
      responses:
        default:
          description: Validation, access or a missing record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: Up to 30 active students matching name or code, with their current class
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EnrollmentStudent'}
  /admin/enrollment/transfer:
    post:
      operationId: transferStudent
      tags: [admin]
      summary: Move a child to another class (FR28). Past answers, marks and attendance stay theirs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferInput'}
      responses:
        default:
          description: Validation, access or a missing record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "201":
          description: The recorded move
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentChange'}
  /admin/enrollment/class-teacher:
    put:
      operationId: setClassTeacher
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassTeacherInput'}
      responses:
        default:
          description: Validation, access or a missing record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: The class with its new class teacher
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentClass'}
  /admin/enrollment/history:
    get:
      operationId: getEnrollmentHistory
      tags: [admin]
      parameters:
        - {name: studentId, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        default:
          description: Validation, access or a missing record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: The most recent moves, newest first; one child's when studentId is given
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EnrollmentChange'}
  /admin/promotion/preview:
    get:
      operationId: getPromotionPreview
      tags: [admin]
      summary: What moving a school year up would do, before anything is changed (FR29)
      parameters:
        - {name: fromYear, in: query, required: true, schema: {type: string, pattern: '^\d{4}-\d{4}$'}}
      responses:
        default:
          description: Validation, access or a missing record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: One proposed row per active child
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromotionPreview'}
  /admin/promotion:
    post:
      operationId: applyPromotion
      tags: [admin]
      summary: Move the year up in one transaction, with the exceptions the administrator chose
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromotionInput'}
      responses:
        default:
          description: Validation, access or a missing record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        "200":
          description: What was done
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromotionResult'}
  /content/library:
    get:
      operationId: getLibraryBooks
      tags: [content]
      summary: Approved textbooks for independent reading across all grades
      responses:
        "200":
          description: Books available to students and staff; reading assigns no work
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LibraryBook"}
        "401":
          description: Not signed in
        "403":
          description: Requires a student or staff role
  /teacher/timetable/{slotId}/students:
    parameters:
      - in: path
        name: slotId
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getTimetableStudents
      tags: [teacher]
      responses:
        "200":
          description: Class roster and membership of this timetable slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableStudents'
    put:
      operationId: setTimetableStudents
      tags: [teacher]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableStudentsInput'
      responses:
        "204":
          description: Membership saved

  /preview/students:
    get:
      operationId: getPreviewStudents
      tags: [teacher]
      summary: Read-only local database preview
      responses:
        "200":
          description: Database records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreviewStudent"
  /teacher/catalog:
    get:
      operationId: getTeacherCatalog
      tags: [teacher]
      summary: Read-only local database preview
      responses:
        "200":
          description: Database records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
  /student/subjects:
    get:
      operationId: getStudentSubjects
      tags: [student]
      summary: Read-only local database preview
      responses:
        "200":
          description: Database records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectOverview"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session/me:
    get:
      operationId: getCurrentUser
      tags: [session]
      summary: Get the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /student/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Get the student's daily work
      responses:
        "200":
          description: Student dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
  /student/assignments/{assignmentId}:
    get:
      operationId: getStudentAssignment
      tags: [student]
      summary: Get an assignment and its learning material
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentDetail"
        "404":
          description: Assignment not found
  /student/assignments/{assignmentId}/start:
    post:
      operationId: startStudentAssignment
      tags: [student]
      summary: Start or resume an assignment
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentState"
  /student/assignments/{assignmentId}/steps:
    post:
      operationId: saveStudentAssignmentStep
      tags: [student]
      summary: Save reading, example, or practice step progress
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentStepInput"
      responses:
        "200":
          description: Saved step progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentState"
  /student/assignments/{assignmentId}/submit:
    post:
      operationId: submitStudentAssignment
      tags: [student]
      summary: Submit an understanding check
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentSubmissionInput"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Invalid submission
  /student/progress:
    get:
      operationId: getStudentProgress
      tags: [student]
      summary: Get skill progress and attempt history
      responses:
        "200":
          description: Student progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"
  /student/record:
    get:
      operationId: getStudentRecord
      tags: [student]
      summary: The signed-in student's own register entry and family contacts
      responses:
        "200":
          description: Student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRecord"
  /student/study-plan:
    get:
      operationId: getStudentStudyPlan
      tags: [student]
      summary: The student's own generated study plan, week by week
      responses:
        "200":
          description: One entry per subject and week
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyPlanWeek"
  /student/placements:
    get:
      operationId: getStudentPlacements
      tags: [student]
      summary: Where this student was placed, and the plan that level prescribes
      responses:
        "200":
          description: One entry per subject the student has been placed in
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentPlacement"
  /teacher/productive/classes:
    get:
      operationId: getMarkableClasses
      tags: [teacher]
      summary: Classes whose writing and speaking tasks this teacher may judge
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarkableClass"
  /teacher/productive/classes/{classId}:
    get:
      operationId: getProductiveMarkSheet
      tags: [teacher]
      summary: One class's children with the tasks their own level asks of them
      parameters:
        - name: classId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Mark sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductiveMarkSheet"
  /teacher/productive/rating:
    put:
      operationId: saveProductiveRating
      tags: [teacher]
      summary: Record one judgement, and re-derive whether the level is confirmed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductiveRatingInput"
      responses:
        "200":
          description: The refreshed mark sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductiveMarkSheet"
  /teacher/my-week:
    get:
      operationId: getTeacherWeek
      tags: [teacher]
      summary: The signed-in teacher's own week, every class they take
      responses:
        "200":
          description: One entry per timetable slot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherWeekSlot"
  /teacher/dashboard:
    get:
      operationId: getTeacherDashboard
      tags: [teacher]
      summary: Get teacher dashboard summary
      responses:
        "200":
          description: Teacher dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
  /teacher/classes:
    get:
      operationId: getTeacherClasses
      tags: [teacher]
      summary: List authorized classes
      responses:
        "200":
          description: Authorized classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherClass"
  /teacher/review-queue:
    get:
      operationId: getTeacherReviewQueue
      tags: [teacher]
      summary: List written answers awaiting review
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"
  /teacher/reviews/{attemptId}:
    post:
      operationId: reviewTeacherAttempt
      tags: [teacher]
      summary: Review a written answer using the rubric
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: Reviewed attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
  /teacher/class-topics:
    get:
      operationId: getTeacherClassTopics
      tags: [teacher]
      summary: Every class and subject this teacher may see, with the topic each is on
      responses:
        "200":
          description: Class topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassTopic"
  /teacher/class-topics/{classId}/{subjectCode}/sections:
    get:
      operationId: getTeacherOutlineChoices
      tags: [teacher]
      summary: The sections of one class's core book, to choose a topic from
      parameters:
        - name: classId
          in: path
          required: true
          schema: {type: string}
        - name: subjectCode
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Book sections in book order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutlineChoice"
        "403":
          description: Not this teacher's class
  /teacher/class-topic:
    put:
      operationId: setClassTopic
      tags: [teacher]
      summary: Move a class to a section of its core book, or clear the pointer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassTopicInput"
      responses:
        "200":
          description: The class topic as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassTopic"
        "403":
          description: Not a subject this teacher takes in this class
        "404":
          description: This class does not study this subject
        "409":
          description: No core book, or the section belongs to another book
  /teacher/integrations/workspace:
    get:
      operationId: getWorkspaceIntegrationDashboard
      tags: [teacher]
      summary: Get the mock Google Workspace integration model and audit state
      responses:
        "200":
          description: Workspace integration dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceIntegrationDashboard"
  /teacher/integrations/workspace/simulate:
    post:
      operationId: simulateWorkspaceIntegration
      tags: [teacher]
      summary: Simulate an idempotent Classroom, Sheets, Drive, or coursework operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSimulationInput"
      responses:
        "200":
          description: Updated workspace integration dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceIntegrationDashboard"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in and start a session
      description: >
        On success the session token is returned as an httpOnly cookie, never
        in the body. A wrong password and an unknown username give the same
        401 so neither can be probed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          description: Username or password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked and the cookie cleared
  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      summary: The signed-in user
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/today:
    get:
      operationId: getStudentToday
      tags: [student]
      summary: The lesson scheduled for the signed-in student today
      responses:
        "200":
          description: Today's lesson, or none when nothing is scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentToday"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not linked to a student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/schedule:
    get:
      operationId: getStudentSchedule
      tags: [student]
      summary: The signed-in student's class lessons and personal work for one day
      parameters:
        - name: date
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date in Ulaanbaatar, defaults to today
      responses:
        "200":
          description: The student's own schedule for the selected day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentToday"
        "400":
          description: Invalid calendar date
        "401":
          description: Not signed in
        "403":
          description: Not a linked student
  /teacher/schedule:
    get:
      operationId: getTeacherSchedule
      tags: [teacher]
      summary: A class's calendar days and subject slots, including blank and weekend rows
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: Inclusive start date (YYYY-MM-DD). Defaults to seven days ago.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          description: Inclusive end date (YYYY-MM-DD). Defaults to fourteen days ahead.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Scheduled days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherSchedule"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /content/materials/{materialId}/file:
    get:
      operationId: getMaterialFile
      tags: [content]
      summary: The approved file for a source material
      description: >
        Streams the stored file, currently always a PDF. Viewers accept a
        #page=N fragment, so a lesson can open the book at its own pages.
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: No approved version, or the stored file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in account's password
      description: >
        Every other session for the account is revoked, so a password changed
        because it leaked actually locks the other holder out. The session
        making the change survives, so the user is not signed out of the tab
        they are working in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed and other sessions revoked
        "400":
          description: The new password fails the length rule, or repeats the old one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in, or the current password is wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/quiz-attempts:
    post:
      operationId: submitQuizAttempt
      tags: [student]
      summary: Record the signed-in student's run at a lesson's practice check
      description: >
        The server scores nothing: the questions live in the frontend for now,
        so it records what was answered and trusts the client's marking. That
        is fine for practice a student marks themselves and would not be for a
        graded assessment - the diagnostic block moves questions into the
        database and the scoring with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "201":
          description: Attempt recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttempt"
        "400":
          description: Malformed attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not linked to a student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/quiz-attempts:
    get:
      operationId: getTeacherQuizAttempts
      tags: [teacher]
      summary: What a class answered, newest first
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: >
            Earliest calendar day to include, YYYY-MM-DD, read in
            Asia/Ulaanbaatar. Omitted means no lower bound.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          description: Latest calendar day to include, inclusive.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recorded attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherQuizAttempts"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /staff/fields:
    get:
      operationId: getStaffFields
      tags: [staff]
      summary: What a staff profile is made of
      description: >
        The school decides this, not the code. Each row says what a field is
        called, how its value is entered, and whether the member of staff may
        write it themselves. An administrator also sees the fields that have
        been switched off, because turning one back on is theirs to do and
        they cannot do it blind.
      responses:
        "200":
          description: The fields, in the order they are shown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffField"
  /staff:
    get:
      operationId: getStaffList
      tags: [staff]
      summary: Every member of staff, with their profile values
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffProfile"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /staff/me:
    get:
      operationId: getMyStaffProfile
      tags: [staff]
      summary: The signed-in member of staff's own record
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "404":
          description: This account has no staff record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: saveMyStaffProfile
      tags: [staff]
      summary: Write the fields this person is allowed to write
      description: >
        Only the fields marked selfEditable. A job title is a decision the
        school made about somebody, not a preference they may set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProfileInput"
      responses:
        "200":
          description: The profile as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "403":
          description: A field only an administrator may write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /staff/{teacherId}:
    parameters:
      - name: teacherId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getStaffProfile
      tags: [staff]
      summary: One member of staff's record
      description: >
        Their own, or anybody's for an administrator. A staff record carries a
        telephone number and a department, which one teacher is not owed about
        another merely because they work in the same school.
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "403":
          description: Somebody else's record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: saveStaffProfile
      tags: [staff]
      summary: Write one member of staff's fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProfileInput"
      responses:
        "200":
          description: The profile as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "403":
          description: Somebody else's record, or an administrator-only field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /staff/{teacherId}/photo:
    parameters:
      - name: teacherId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getStaffPhoto
      tags: [staff]
      summary: The photograph, or 404 when there is none
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No photograph
    post:
      operationId: uploadStaffPhoto
      tags: [staff]
      summary: Replace the photograph
      description: >
        Their own, or anybody's for an administrator. One file per person,
        named after the account, so a second upload leaves no orphan behind.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoUrl:
                    type: string
                required: [photoUrl]
        "400":
          description: Not an image this server stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/photo:
    get:
      operationId: getMyPhoto
      tags: [staff]
      summary: The signed-in person's own photograph
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No photograph
  /staff/{teacherId}/card:
    parameters:
      - name: teacherId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getTeacherCard
      tags: [staff]
      summary: The teacher as their class sees them
      description: >
        Narrower than the staff record on purpose. A profile carries a
        telephone number and whatever else the school records, and a class of
        twelve-year-olds is not the audience for any of it. This is the name,
        the face, what they are employed as, and what they teach.
      responses:
        "200":
          description: The card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherCard"
        "404":
          description: No such teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/staff/fields:
    post:
      operationId: addStaffField
      tags: [staff]
      summary: Add a field of the school's own
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffFieldInput"
      responses:
        "201":
          description: The fields, including the new one
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffField"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/staff/fields/{fieldId}:
    parameters:
      - name: fieldId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateStaffField
      tags: [staff]
      summary: Rename a field, move it, or put it away
      description: >
        A field with a column behind it may be renamed and reordered but not
        switched off: the column would be left with nothing describing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffFieldPatch"
      responses:
        "200":
          description: The fields as they now stand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffField"
        "400":
          description: A built-in field cannot be switched off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/class-day:
    get:
      operationId: getClassDay
      tags: [teacher]
      summary: One class on one day - what is set, and who has done it
      description: >
        The two halves of a teacher's morning in one answer. The lessons are
        the same content the class is served, rather than a teacher's-eye
        summary that can drift from it, and the students are the whole
        register: a child who answered nothing is present with no attempts,
        because who has not done the work is the question worth asking.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: One subject the teacher holds here; omitted means all of them.
          schema:
            type: integer
        - name: on
          in: query
          required: false
          description: A school date. Omitted means today in Ulaanbaatar.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassDay"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/quiz-paper:
    get:
      operationId: getTeacherQuizPaper
      tags: [teacher]
      summary: The questions behind a lesson's quiz, with the key
      description: >
        What the class is actually asked, for the person who has to judge
        whether the asking is any good. The student's copy of this leaves the
        answers on the server; the teacher's carries them, because a question
        cannot be reviewed without knowing which option is meant to be right.
        Scoped through the class, which is what establishes that this member of
        staff teaches the subject the questions belong to.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: lessonId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherQuizPaper"
        "403":
          description: Not a teacher of that class or that subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/assessment-sheet:
    get:
      operationId: getAssessmentSheet
      tags: [teacher]
      summary: The register for marking a paper assessment
      description: >
        Primary grades do the monthly assessment in a notebook, so nothing
        reaches the system until a teacher has marked it. Returns the skills
        this class may be marked against and where every student currently
        stands on the one chosen. A student nobody has assessed is present
        with empty values rather than absent.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
        - name: skillId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSheet"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/assessments:
    post:
      operationId: submitAssessment
      tags: [teacher]
      summary: Record a teacher's own marking of a paper assessment
      description: >
        The level may be given without a score. That is the teacher overriding
        the arithmetic, which the requirements ask for by name, and demanding
        a percentage would put a number in the database nobody measured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSubmission"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitAssessmentResult"
        "400":
          description: A skill or student that does not belong to the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/item-analysis:
    get:
      operationId: getItemAnalysis
      tags: [teacher]
      summary: Which questions a class got wrong, worst first
      description: >
        One row per student per question, their most recent answer, so a
        student who retook a quiz four times cannot outvote four students who
        took it once. The most-chosen wrong answer comes with it: a distractor
        that attracts half the class is a specific misunderstanding rather than
        a gap, and the two need different teaching.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-question results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemAnalysis"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/class-skills:
    get:
      operationId: getClassSkills
      tags: [teacher]
      summary: How a class stands on each skill it has been measured on
      description: >
        Drawn from the answers students have already given, not from a separate
        exam. A skill nobody has attempted is absent rather than reported as
        zero, so the list only ever contains skills there is evidence about.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
      responses:
        "200":
          description: Skill standing for the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassSkills"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/lessons:
    get:
      operationId: getTeacherLessons
      tags: [teacher]
      summary: Approved lessons for a class, in the order the book teaches them
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
      responses:
        "200":
          description: Lessons the class can be scheduled
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulableLesson"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/schedule/generate:
    post:
      operationId: generateSchedule
      tags: [teacher]
      summary: Fill a term's empty school days from the book's own order
      description: >
        The sequence is already fixed by the textbook and the curriculum, so it
        is laid out rather than typed in. Days that already carry a lesson are
        left alone: regenerating must never discard a teacher's correction.
        Weekends are skipped; holidays are not modelled yet, so a teacher
        clears those days by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScheduleInput"
      responses:
        "200":
          description: What was laid out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateScheduleResult"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/schedule/day:
    put:
      operationId: setScheduleDay
      tags: [teacher]
      summary: Set, replace or clear one day's lesson
      description: >
        The teacher's correction surface. A null lessonId clears the day, which
        is how a holiday or a school event is recorded. Weekend lessons may only
        be assigned, changed, or cleared by an administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleDayInput"
      responses:
        "200":
          description: >
            Day updated. The rest of the term is not: where changing this day's
            section would move later days, they come back as a proposal for the
            teacher to approve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDayResult"
        "400":
          description: Malformed day or a lesson that is not schedulable here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/exams:
    get:
      operationId: getTeacherExams
      tags: [teacher]
      summary: Exams set for a class
      parameters:
        - in: query
          name: classId
          required: true
          schema: { type: integer }
        - in: query
          name: subjectId
          schema: { type: integer }
      responses:
        "200":
          description: Sittings, newest window first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamSummary"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createExam
      tags: [teacher]
      summary: Set an exam for a class, a group, or named children
      description: >
        A paper is a set of questions; a sitting is a class, a window and an
        audience. They are made together here because a paper nobody sits is
        not a thing a teacher wants to have made.

        Questions may be named, drawn at random, or both. Drawing is not a
        shortcut: it is what stops a paper set once being the same paper next
        year. Naming is how a teacher insists on the question they meant to
        ask. What is named is asked, and the draw fills the rest.

        An empty studentIds is the whole register, which is the ordinary case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamInput"
      responses:
        "201":
          description: Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamCreated"
        "400":
          description: A bad window, no questions, or a child who is not in the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class or subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/exams/{sittingId}:
    get:
      operationId: getTeacherExam
      tags: [teacher]
      summary: One exam, with the key and who has sat it
      parameters:
        - in: path
          name: sittingId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The paper and the register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherExam"
        "403":
          description: Not a teacher of that class or subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such exam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/exams/{sittingId}/reopen:
    post:
      operationId: reopenExam
      tags: [teacher]
      summary: Let named children sit again
      description: >
        A child cannot sit a paper twice on their own - that is what makes it a
        paper rather than practice - so the only way to another go is a teacher
        deciding there should be one. The attempt already made is kept.
      parameters:
        - in: path
          name: sittingId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenExamInput"
      responses:
        "200":
          description: Reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReopenExamResult"
        "400":
          description: No children named, or one who is not in the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class or subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/exams/{sittingId}/answers:
    put:
      operationId: releaseExamAnswers
      tags: [teacher]
      summary: Release the key to the children, or take it back
      description: >
        The same rule the daily check follows, and it bites harder here: a
        paper is sat once, and a child who sees the answers while a classmate
        is still writing has been handed the marks.
      parameters:
        - in: path
          name: sittingId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseAnswersInput"
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseAnswersResult"
        "403":
          description: Not a teacher of that class or subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/exams/{sittingId}/entry:
    post:
      operationId: enterPaperAnswers
      tags: [teacher]
      summary: Enter what one child wrote on a paper exam
      description: >
        The written half of UC10. A paper sitting has already happened by the
        time anybody types it in, so there is no window here - a teacher
        writing it up on Sunday evening is not sitting it late.

        Marked by the same rule as an online sitting, because a school that
        cannot compare a paper exam with an online one has two systems rather
        than one. Re-entering is a second attempt, which is what a teacher gets
        after reopening the sitting for that child.
      parameters:
        - in: path
          name: sittingId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperEntryInput"
      responses:
        "201":
          description: Marked and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"
        "400":
          description: Not a paper sitting, a child it was not set for, or a score outside the question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class or subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This child's answers are already in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/exams:
    get:
      operationId: getStudentExams
      tags: [student]
      summary: The exams set for me
      responses:
        "200":
          description: Recent and current sittings
          content:
