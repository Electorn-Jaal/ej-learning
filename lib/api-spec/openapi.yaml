        percentage:
          type: ["integer", "null"]
        evidenceCount:
          type: integer
        lastEvidenceDate:
          type: ["string", "null"]
      required: [skill, code, subject, gradeLevel, status, percentage, evidenceCount, lastEvidenceDate]
    AttemptHistoryItem:
      type: object
      properties:
        id:
          type: string
        assignment:
          type: string
        submittedAt:
          type: string
        status:
          type: string
        score:
          type: ["number", "null"]
        maxScore:
          type: ["number", "null"]
        reviewer:
          type: ["string", "null"]
      required: [id, assignment, submittedAt, status, score, maxScore, reviewer]
    StudentProgress:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillProgress"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/AttemptHistoryItem"
        dataNotice:
          type: string
      required: [skills, attempts, dataNotice]
    AttentionRow:
      type: object
      description: >
        A student in this class worth a second look. Reasons are limited to
        what the subject can actually say: a class that works through a
        textbook has no placement, so NO_PLACEMENT is only ever emitted for a
        subject that is levelled.
      properties:
        studentId:
          type: integer
        studentCode:
          type: string
        studentName:
          type: string
        level:
          type: ["string", "null"]
        reason:
          type: string
          enum: [NO_PLACEMENT, LOW_SCORE, NOT_ANSWERED]
        detail:
          type: string
      required: [studentId, studentCode, studentName, level, reason, detail]
    MasteryStatus:
      type: string
      enum: [MASTERED, DEVELOPING, GAP]
    AssessableSkill:
      type: object
      properties:
        skillId:
          type: integer
        skillCode:
          type: string
        skillName:
          type: string
      required: [skillId, skillCode, skillName]
    RosterEntry:
      type: object
      description: >
        One student's standing on the chosen skill. Every field but the
        identity is null for a student nobody has assessed yet.
      properties:
        studentId:
          type: integer
        studentCode:
          type: string
        studentName:
          type: string
        masteryStatus:
          type: ["string", "null"]
        masteryScore:
          type: ["integer", "null"]
        source:
          description: TEACHER where a person entered it, AUTO where the system computed it.
          type: ["string", "null"]
        assessedBy:
          type: ["string", "null"]
        lastAssessedAt:
          type: ["string", "null"]
      required:
        [studentId, studentCode, studentName, masteryStatus, masteryScore,
         source, assessedBy, lastAssessedAt]
    AssessmentSheet:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        gradeLevel:
          type: integer
        stage:
          type: string
          enum: [PRIMARY, SECONDARY]
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AssessableSkill"
        skillId:
          type: ["integer", "null"]
        students:
          type: array
          items:
            $ref: "#/components/schemas/RosterEntry"
      required: [classId, className, gradeLevel, stage, skills, skillId, students]
    AssessmentEntry:
      type: object
      properties:
        studentId:
          type: integer
        status:
          $ref: "#/components/schemas/MasteryStatus"
        score:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
      required: [studentId, status, score]
    AssessmentSubmission:
      type: object
      properties:
        classId:
          type: integer
        skillId:
          type: integer
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AssessmentEntry"
      required: [classId, skillId, entries]
    SubmitAssessmentResult:
      type: object
      properties:
        classId:
          type: integer
        skillId:
          type: integer
        recorded:
          type: integer
      required: [classId, skillId, recorded]
    ItemAnalysisRow:
      type: object
      properties:
        itemId:
          type: integer
        prompt:
          type: string
        skillName:
          type: string
        answered:
          type: integer
        correct:
          type: integer
        percentCorrect:
          type: integer
        commonWrongAnswer:
          description: The wrong option chosen most often, or null where nobody got it wrong.
          type: ["string", "null"]
        commonWrongCount:
          type: integer
      required:
        [itemId, prompt, skillName, answered, correct, percentCorrect,
         commonWrongAnswer, commonWrongCount]
    ItemAnalysis:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemAnalysisRow"
      required: [classId, className, items]
    WeakStudent:
      type: object
      properties:
        studentId:
          type: integer
        studentName:
          type: string
        score:
          type: integer
      required: [studentId, studentName, score]
    ClassSkill:
      type: object
      description: >
        One skill, and how the measured students in the class stand on it.
        `assessed` counts students with any evidence; the three status counts
        add up to it.
      properties:
        skillId:
          type: integer
        skillCode:
          type: string
        skillName:
          type: string
        gradeLevel:
          type: ["integer", "null"]
        assessed:
          type: integer
        gap:
          type: integer
        developing:
          type: integer
        mastered:
          type: integer
        averageScore:
          type: integer
        weakest:
          description: The lowest-scoring students who have not mastered it, capped for reading.
          type: array
          items:
            $ref: "#/components/schemas/WeakStudent"
        weakestTotal:
          description: How many have not mastered it, which may exceed the names listed.
          type: integer
      required:
        [skillId, skillCode, skillName, gradeLevel, assessed, gap, developing,
         mastered, averageScore, weakest, weakestTotal]
    ClassSkills:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/ClassSkill"
      required: [classId, className, skills]
    TeacherClassToday:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        gradeLevel:
          type: integer
        subjectName:
          type: string
        subjectId:
          description: >
            Null for an administrator's card, which stands for the whole class
            rather than one subject. Carried so a link from this card can open
            the timetable or the results on the subject the card is about,
            instead of dropping the reader on whatever the page picks first.
          type: ["integer", "null"]
        levelFramework:
          description: The proficiency ladder this subject uses, or null where it uses none.
          type: ["string", "null"]
        lessonCode:
          type: ["string", "null"]
        skillName:
          type: ["string", "null"]
        pageFrom:
          type: ["integer", "null"]
        pageTo:
          type: ["integer", "null"]
        studentCount:
          type: integer
        answeredToday:
          type: integer
        attention:
          type: array
          items:
            $ref: "#/components/schemas/AttentionRow"
      required:
        - classId
        - className
        - gradeLevel
        - subjectName
        - subjectId
        - levelFramework
        - lessonCode
        - skillName
        - pageFrom
        - pageTo
        - studentCount
        - answeredToday
        - attention
    TeacherDashboard:
      type: object
      description: >
        Organised by class rather than by teacher. A teacher holds several
        classes and often more than one subject, so totals across all of them
        answer no question anybody asks.
      properties:
        teacherName:
          type: string
        dateLabel:
          type: string
        classes:
          type: array
          items:
            $ref: "#/components/schemas/TeacherClassToday"
      required: [teacherName, dateLabel, classes]
    TeacherClass:
      type: object
      description: >
        One entry in the teacher's class picker. A teacher who holds two
        subjects in a class gets one entry per subject plus one for all of
        them, so id alone no longer identifies an entry - the pair
        (id, subjectId) does.
      properties:
        id:
          type: string
        name:
          type: string
        gradeLevel:
          type: integer
        subjectId:
          type: integer
          nullable: true
          description: >
            The subject this entry stands for, or null for every subject the
            teacher may look at in the class.
        canEdit:
          type: boolean
          description: >
            Whether this account may change what this entry shows - timetable
            it, mark it, assign it. A class teacher sees subjects somebody else
            takes; those entries come back read-only.
        subject:
          type: string
        studentCount:
          type: integer
        currentTopic:
          type: string
        needsReview:
          type: integer
      required: [id, name, gradeLevel, subjectId, canEdit, subject, studentCount, currentTopic, needsReview]
    ReviewItem:
