        score:
          type: integer
      required: [studentId, studentName, score]
    ClassSkill:
      type: object
      description: >
        One skill, and how the measured students in the class stand on it.
        `assessed` counts students with any evidence; the three status counts
        add up to it.
      properties:
        skillId:
          type: integer
        skillCode:
          type: string
        skillName:
          type: string
        gradeLevel:
          type: ["integer", "null"]
        assessed:
          type: integer
        gap:
          type: integer
        developing:
          type: integer
        mastered:
          type: integer
        averageScore:
          type: integer
        weakest:
          description: The lowest-scoring students who have not mastered it, capped for reading.
          type: array
          items:
            $ref: "#/components/schemas/WeakStudent"
        weakestTotal:
          description: How many have not mastered it, which may exceed the names listed.
          type: integer
      required:
        [skillId, skillCode, skillName, gradeLevel, assessed, gap, developing,
         mastered, averageScore, weakest, weakestTotal]
    ClassSkills:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/ClassSkill"
      required: [classId, className, skills]
    TeacherClassToday:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        gradeLevel:
          type: integer
        subjectName:
          type: string
        subjectId:
          description: >
            Null for an administrator's card, which stands for the whole class
            rather than one subject. Carried so a link from this card can open
            the timetable or the results on the subject the card is about,
            instead of dropping the reader on whatever the page picks first.
          type: ["integer", "null"]
        levelFramework:
          description: The proficiency ladder this subject uses, or null where it uses none.
          type: ["string", "null"]
        lessonCode:
          type: ["string", "null"]
        skillName:
          type: ["string", "null"]
        pageFrom:
          type: ["integer", "null"]
        pageTo:
          type: ["integer", "null"]
        studentCount:
          type: integer
        answeredToday:
          type: integer
        attention:
          type: array
          items:
            $ref: "#/components/schemas/AttentionRow"
      required:
        - classId
        - className
        - gradeLevel
        - subjectName
        - subjectId
        - levelFramework
        - lessonCode
        - skillName
        - pageFrom
        - pageTo
        - studentCount
        - answeredToday
        - attention
    TeacherDashboard:
      type: object
      description: >
        Organised by class rather than by teacher. A teacher holds several
        classes and often more than one subject, so totals across all of them
        answer no question anybody asks.
      properties:
        teacherName:
          type: string
        dateLabel:
          type: string
        classes:
          type: array
          items:
            $ref: "#/components/schemas/TeacherClassToday"
      required: [teacherName, dateLabel, classes]
    TeacherClass:
      type: object
      description: >
        One entry in the teacher's class picker. A teacher who holds two
        subjects in a class gets one entry per subject plus one for all of
        them, so id alone no longer identifies an entry - the pair
        (id, subjectId) does.
      properties:
        id:
          type: string
        name:
          type: string
        gradeLevel:
          type: integer
        subjectId:
          type: integer
          nullable: true
          description: >
            The subject this entry stands for, or null for every subject the
            teacher may look at in the class.
        canEdit:
          type: boolean
          description: >
            Whether this account may change what this entry shows - timetable
            it, mark it, assign it. A class teacher sees subjects somebody else
            takes; those entries come back read-only.
        subject:
          type: string
        studentCount:
          type: integer
        currentTopic:
          type: string
        needsReview:
          type: integer
      required: [id, name, gradeLevel, subjectId, canEdit, subject, studentCount, currentTopic, needsReview]
    ReviewItem:
      type: object
      properties:
        maxScore:
          type: number
        attemptId:
          type: string
        studentName:
          type: string
        className:
          type: string
        topic:
          type: string
        skill:
          type: string
        answer:
          type: string
        submittedAt:
          type: string
        rubric:
          type: array
          items:
            type: string
      required: [attemptId, studentName, className, topic, skill, answer, submittedAt, rubric]
    ReviewInput:
      type: object
      properties:
        score:
          type: number
          minimum: 0
        feedback:
          type: string
          minLength: 1
        rubricNotes:
          type: string
          minLength: 1
        idempotencyKey:
          type: string
          minLength: 8
      required: [score, feedback, rubricNotes, idempotencyKey]
    ReviewResult:
      type: object
      properties:
        attemptId:
          type: string
        status:
          type: string
          enum: [reviewed]
        score:
          type: number
        feedback:
          type: string
        nextAction:
          $ref: "#/components/schemas/NextAction"
      required: [attemptId, status, score, feedback, nextAction]
    StudentGuardian:
      type: object
      description: >-
        A telephone number the school can reach this child's family on.
        relationMn is null for the two thirds of numbers that arrive without
        one, and fullName is almost always null - the admissions sheet records
        a number and at best a role, never a parent's name.
      properties:
        relationMn: {type: [string, "null"]}
        fullName: {type: [string, "null"]}
        phone: {type: string}
      required: [relationMn, fullName, phone]
    StudentRecord:
      type: object
      description: >-
        What the school's register says about this child. Fields the register
        left blank come back null and the screen omits them rather than
        printing a dash: which records are missing is the school's own data
        question, not something to put in front of a child.
      properties:
        studentCode: {type: string}
        displayName: {type: string}
        familyName: {type: [string, "null"]}
        givenName: {type: [string, "null"]}
        personalFile: {type: [string, "null"]}
        attendance: {type: [string, "null"]}
        notes: {type: [string, "null"]}
        className: {type: string}
        gradeLevel: {type: integer}
        schoolYear: {type: [string, "null"]}
        guardians:
          type: array
          items:
            $ref: "#/components/schemas/StudentGuardian"
      required:
        [studentCode, displayName, familyName, givenName, personalFile,
         attendance, notes, className, gradeLevel, schoolYear, guardians]
    StudyPlanDay:
      type: object
      description: >-
        One school day of the plan. weekdayNo is 1 for Monday. score and status
        are how it went: almost every day is NOT ASSESSED with no score, which
        is the honest state while the plan is written and the term untaught -
        a zero in place of a missing mark would be an invention.
      properties:
        weekdayNo: {type: integer}
        focus: {type: [string, "null"]}
        sourceLabel: {type: [string, "null"]}
        unitFocus: {type: [string, "null"]}
        pages: {type: [string, "null"]}
        task: {type: [string, "null"]}
        teacherCheck: {type: [string, "null"]}
        target: {type: [string, "null"]}
        score: {type: [number, "null"]}
        status: {type: string}
      required:
        [weekdayNo, focus, sourceLabel, unitFocus, pages, task, teacherCheck,
         target, score, status]
    StudyPlanSkill:
      type: object
      description: What one week is for in one skill, and what confirms it.
      properties:
        domain: {type: string}
        sourceLabel: {type: [string, "null"]}
        unitFocus: {type: [string, "null"]}
        pages: {type: [string, "null"]}
        task: {type: [string, "null"]}
        masteryTarget: {type: [string, "null"]}
        status: {type: string}
      required: [domain, sourceLabel, unitFocus, pages, task, masteryTarget, status]
    StudyPlanWeek:
      type: object
      description: >-
        One week of the plan, in both of its shapes: the five days a child
        works through, and the six skills the week is aimed at. They describe
        the same week and answer different questions - a child works from the
        days, a parent reads the skills.
      properties:
        subjectCode: {type: string}
        weekNo: {type: integer}
        days:
          type: array
          items:
            $ref: "#/components/schemas/StudyPlanDay"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/StudyPlanSkill"
      required: [subjectCode, weekNo, days, skills]
    TeacherWeekSlot:
      type: object
      description: >-
        One period of a teacher's week. Rows are times and the cell names the
        class, which is the question a teacher asks of a week - the per-class
        view answers "what does 9a do", which the class list already answers.
      properties:
        slotId: {type: string}
        weekdayNo: {type: integer}
        periodNo: {type: integer}
        startsAt: {type: [string, "null"]}
        endsAt: {type: [string, "null"]}
        classId: {type: integer}
        className: {type: string}
        gradeLevel: {type: integer}
        subjectId: {type: integer}
        subject: {type: string}
        groupLabel: {type: [string, "null"]}
        teacherName: {type: [string, "null"]}
      required:
        [slotId, weekdayNo, periodNo, startsAt, endsAt, classId, className,
         gradeLevel, subjectId, subject, groupLabel, teacherName]
    MarkableClass:
      type: object
      properties:
        classId: {type: string}
        className: {type: string}
        gradeLevel: {type: integer}
        students: {type: integer}
      required: [classId, className, gradeLevel, students]
    ProductiveTask:
      type: object
      description: >-
        One writing or speaking task at a child's level, with the can-do
        statement a teacher judges it against and whatever they have already
        said. score null means nobody has looked yet.
      properties:
        itemId: {type: string}
        itemCode: {type: string}
        domain: {type: string}
        prompt: {type: string}
        rubric: {type: [string, "null"]}
        maxScore: {type: number}
        score: {type: [number, "null"]}
        comment: {type: [string, "null"]}
        ratedByName: {type: [string, "null"]}
        ratedAt: {type: [string, "null"]}
      required:
        [itemId, itemCode, domain, prompt, rubric, maxScore, score, comment,
         ratedByName, ratedAt]
    ProductiveStudent:
      type: object
      description: >-
        A placed child and the tasks their own level asks of them - not the
        class's level. Two children in one class placed at A2 and C1 are asked
        different things, which is the point of having placed them.
      properties:
        studentId: {type: string}
        studentCode: {type: string}
        studentName: {type: string}
        levelCode: {type: string}
        levelName: {type: string}
        objectiveScore: {type: [number, "null"]}
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ProductiveTask"
      required:
        [studentId, studentCode, studentName, levelCode, levelName,
         objectiveScore, tasks]
    ProductiveMarkSheet:
      type: object
      properties:
        classId: {type: string}
        className: {type: string}
        students:
          type: array
          items:
            $ref: "#/components/schemas/ProductiveStudent"
      required: [classId, className, students]
    ProductiveRatingInput:
      type: object
      properties:
        classId: {type: string}
        studentId: {type: string}
        itemId: {type: string}
        score: {type: number}
        comment: {type: [string, "null"]}
      required: [classId, studentId, itemId, score]
    PlacementStep:
      type: object
      description: >-
        One skill's worth of work at a level: the book or task bank, the unit,
        what the child does, and how a teacher confirms it. sourceLabel is text
        rather than a link because most of these titles are not in the library
        yet; materialId is filled in only for the ones that are.
      properties:
        domain: {type: string}
        sequenceNo: {type: integer}
        sourceLabel: {type: string}
        materialId: {type: [string, "null"]}
        unitFocus: {type: [string, "null"]}
        pages: {type: [string, "null"]}
        task: {type: string}
        priority: {type: string}
        verification: {type: [string, "null"]}
      required:
        [domain, sequenceNo, sourceLabel, materialId, unitFocus, pages, task,
         priority, verification]
    StudentPlacement:
      type: object
      description: >-
        The level a placement test put this child at, and what follows from it.
        provisional is true while the level rests on the objective half of the
        paper alone - the writing and speaking tasks are judged by a teacher and
        most children have not had them marked, so the level is a reading rather
        than a confirmed result.
      properties:
        subjectCode: {type: string}
        subjectName: {type: string}
        levelCode: {type: string}
        levelName: {type: string}
        score: {type: [number, "null"]}
        maxScore: {type: [number, "null"]}
        attemptedOn: {type: [string, "null"]}
        provisional: {type: boolean}
        note: {type: [string, "null"]}
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlacementStep"
      required:
        [subjectCode, subjectName, levelCode, levelName, score, maxScore,
         attemptedOn, provisional, note, steps]
    ClassTopic:
      type: object
      description: >-
        One class and subject, with the section of its core book the teacher
        says the class is on. nodeId null means nobody has set it yet, which is
        not the same as the class being at the start. canEdit separates seeing
        from changing: a class teacher sees every subject their class runs but
        may only move the pointer on the ones they teach. editBasis says where
        that right comes from - ASSIGNED when core.class_teachers names this
        teacher for this class, SUBJECT when only their registered specialty
        does, ADMIN otherwise - because a SUBJECT right is shared with every
        other teacher of that subject and a screen should say so. setByName is
        whoever last moved the pointer, which is what makes that sharing
        visible rather than silent.
      properties:
        classId: {type: string}
        className: {type: string}
        gradeLevel: {type: integer}
        subjectCode: {type: string}
        subjectName: {type: string}
        materialId: {type: [string, "null"]}
        bookTitle: {type: [string, "null"]}
        nodeId: {type: [string, "null"]}
        printedNumber: {type: [string, "null"]}
        topicTitle: {type: [string, "null"]}
        pageFrom: {type: [integer, "null"]}
        pageTo: {type: [integer, "null"]}
        periodNo: {type: [integer, "null"]}
        effectiveOn: {type: [string, "null"]}
        sectionCount: {type: integer}
        canEdit: {type: boolean}
        editBasis:
          type: [string, "null"]
          enum: [ADMIN, ASSIGNED, SUBJECT, null]
        setByName: {type: [string, "null"]}
      required:
        [classId, className, gradeLevel, subjectCode, subjectName, materialId,
         bookTitle, nodeId, printedNumber, topicTitle, pageFrom, pageTo,
         periodNo, effectiveOn, sectionCount, canEdit, editBasis, setByName]
    OutlineChoice:
      type: object
      description: One section of a class's core book, in book order.
      properties:
        nodeId: {type: string}
        printedNumber: {type: [string, "null"]}
        title: {type: string}
        pageFrom: {type: [integer, "null"]}
        pageTo: {type: [integer, "null"]}
        periodNo: {type: [integer, "null"]}
        sequenceNo: {type: integer}
        isCurrent: {type: boolean}
      required:
        [nodeId, printedNumber, title, pageFrom, pageTo, periodNo, sequenceNo,
         isCurrent]
    ClassTopicInput:
      type: object
      description: >-
        outlineNodeId null clears the pointer, which is how a teacher undoes a
        wrong choice rather than being forced to name another one.
      properties:
        classId: {type: string}
        subjectCode: {type: string}
        outlineNodeId: {type: [string, "null"]}
        note: {type: [string, "null"], maxLength: 500}
      required: [classId, subjectCode, outlineNodeId]
    WorkspaceSource:
      type: object
      properties:
        source:
          type: string
          enum: [classroom, sheets, drive, forms]
        role:
          type: string
        status:
          type: string
          enum: [mock_ready, optional, not_connected]
        recordCount:
          type: integer
        lastSyncAt:
          type: ["string", "null"]
      required: [source, role, status, recordCount, lastSyncAt]
    WorkspaceEntity:
      type: object
      properties:
        name:
          type: string
        ownership:
          type: string
          enum: [postgresql, external_reference]
        fields:
          type: array
          items:
            type: string
        relation:
          type: string
      required: [name, ownership, fields, relation]
    WorkspaceCourse:
      type: object
      properties:
        externalCourseId:
          type: string
        internalClassId:
          type: string
        name:
          type: string
        teacher:
          type: string
        studentCount:
          type: integer
        syncStatus:
          type: string
      required: [externalCourseId, internalClassId, name, teacher, studentCount, syncStatus]
    WorkspaceImportBatch:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        fileName:
          type: string
        status:
          type: string
          enum: [draft, validated, approved, rejected]
        rowCount:
          type: integer
        validCount:
          type: integer
        errorCount:
          type: integer
        version:
          type: integer
      required: [id, source, fileName, status, rowCount, validCount, errorCount, version]
    WorkspaceAuditEvent:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        source:
          type: string
        summary:
          type: string
        idempotencyKey:
          type: string
        createdAt:
          type: string
      required: [id, action, source, summary, idempotencyKey, createdAt]
    WorkspaceIntegrationDashboard:
      type: object
      properties:
        mode:
          type: string
          enum: [mock, not_connected]
        systemOfRecord:
          type: string
        principle:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSource"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEntity"
        pipeline:
          type: array
          items:
            type: string
        courses:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceCourse"
        importBatches:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceImportBatch"
        auditEvents:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceAuditEvent"
        dataNotice:
          type: string
      required: [mode, systemOfRecord, principle, sources, entities, pipeline, courses, importBatches, auditEvents, dataNotice]
    WorkspaceSimulationInput:
      type: object
      properties:
        action:
          type: string
          enum: [sync_classroom, import_sheet, import_drive, publish_coursework]
        idempotencyKey:
          type: string
          minLength: 8
      required: [action, idempotencyKey]

    PreviewStudent:
      type: object
      properties:
        id: {type: string}
        code: {type: string}
        displayName: {type: string}
        className: {type: string}
        gradeLevel: {type: integer}
      required: [id, code, displayName, className, gradeLevel]
    SubjectOverview:
      type: object
      description: >-
        One subject a student studies, with the core textbook their class works
        from. origin says how the subject got here: ROSTER was read off books
        the school supplied, CURRICULUM is the national subject list standing in
        until the school confirms it, and a screen is expected to mark the
        difference rather than show a placeholder as a record. Two different
        "where are we" answers come back: the period fields describe what the
        current term covers in the BOOK, while the topic fields are where the
        teacher says the CLASS actually is. A class behind its term shows a
        topic from an earlier period, and that is the truth, not a fault.
      properties:
        code: {type: string}
        name: {type: string}
        assessedSkills: {type: integer}
        masteredSkills: {type: integer}
        approvedLessons: {type: integer}
        origin: {type: string, enum: [ROSTER, CURRICULUM]}
        materialId: {type: [string, "null"]}
        sourceCode: {type: [string, "null"]}
        bookTitle: {type: [string, "null"]}
        bookPages: {type: [integer, "null"]}
        periodCount: {type: [integer, "null"]}
        currentPeriod: {type: [integer, "null"]}
        periodSections: {type: integer}
        periodPageFrom: {type: [integer, "null"]}
        periodPageTo: {type: [integer, "null"]}
        topicNodeId: {type: [string, "null"]}
        topicNumber: {type: [string, "null"]}
        topicTitle: {type: [string, "null"]}
        topicPageFrom: {type: [integer, "null"]}
        topicPageTo: {type: [integer, "null"]}
        topicSince: {type: [string, "null"]}
        bookSections:
          description: How many sections the core book has in total.
          type: integer
        topicPosition:
          description: >-
            Where the current topic sits in that book, counting from one, or
            null when no topic is set. The CLASS's position, not the reader's
            own progress.
          type: [integer, "null"]
      required:
        [code, name, assessedSkills, masteredSkills, approvedLessons, origin,
         materialId, sourceCode, bookTitle, bookPages, periodCount,
         currentPeriod, periodSections, periodPageFrom, periodPageTo,
         topicNodeId, topicNumber, topicTitle, topicPageFrom, topicPageTo,
         topicSince, bookSections, topicPosition]
    CatalogItem:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [lesson, task, check]}
        code: {type: string}
        subject: {type: string}
        skill: {type: string}
        skillCode: {type: string}
        gradeLevel: {type: [integer, "null"]}
        status: {type: string}
        skillStatus: {type: string}
        title: {type: string}
        materialBlocks:
          type: array
          items:
            $ref: "#/components/schemas/MaterialBlock"
        estimatedMinutes: {type: [integer, "null"]}
        maxScore: {type: [number, "null"]}
        sourceTitle: {type: [string, "null"]}
      required: [id, kind, code, subject, skill, skillCode, gradeLevel, status, skillStatus, title, materialBlocks, estimatedMinutes, maxScore, sourceTitle]
