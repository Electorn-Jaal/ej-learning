  /teacher/homework:
    get:
      operationId: getClassHomework
      tags: [teacher]
      summary: Extra work set for a class
      parameters:
        - in: query
          name: classId
          required: true
          schema: { type: integer }
        - in: query
          name: subjectId
          schema: { type: integer }
      responses:
        "200":
          description: Work, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HomeworkSummary"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createHomework
      tags: [teacher]
      summary: Set extra work for a class, a named few, or one child
      description: >
        A deadline is optional and never locks the door: work handed in after
        the date is recorded as late rather than refused, because a door that
        locks turns "I did it at the weekend" into "I did not do it" - the same
        child, a worse record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkInput"
      responses:
        "201":
          description: Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkCreated"
        "400":
          description: No title, a deadline before the day it was set, or a child not in the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class or subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/homework/{homeworkId}:
    get:
      operationId: getHomeworkDetail
      tags: [teacher]
      summary: One piece of work, and every go at it
