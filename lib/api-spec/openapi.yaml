        opensAt: { type: string }
        closesAt: { type: string }
        isOpen: { type: boolean }
        attemptsUsed: { type: integer }
        attemptsAllowed: { type: integer }
        answersOpen: { type: boolean }
        questions:
          description: Empty before the window opens and after the go is spent.
          type: array
          items:
            $ref: "#/components/schemas/ExamQuestion"
    ExamResult:
      type: object
      required: [attemptId, score, maxScore, answersOpen, results]
      properties:
        attemptId: { type: integer }
        score: { type: number }
        maxScore: { type: number }
        answersOpen: { type: boolean }
        results:
          type: array
          items:
            type: object
            required: [itemId, correct, correctOptionIds]
            properties:
              itemId: { type: integer }
              correct: { type: boolean }
              correctOptionIds:
                description: Empty until the teacher releases the key.
                type: array
                items: { type: integer }
    GuardianChild:
      type: object
      required: [studentId, displayName, studentCode, className, gradeLevel, relation]
      properties:
        studentId: { type: integer }
        displayName: { type: string }
        studentCode: { type: string }
        className: { type: ["string", "null"] }
        gradeLevel: { type: ["integer", "null"] }
        relation:
          description: What this account is to the child, where the school wrote it down.
          type: ["string", "null"]
    ChildAttendanceRow:
      type: object
      required: [onDate, timetableSlotId, periodNo, subjectName, state, participation, note]
      properties:
        onDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        timetableSlotId:
          description: Null on a whole-day register, which is what years 1 to 5 keep.
          type: [integer, "null"]
        periodNo: { type: [integer, "null"] }
        subjectName: { type: ["string", "null"] }
        state:
          $ref: "#/components/schemas/AttendanceState"
        participation:
          oneOf:
            - $ref: "#/components/schemas/ParticipationMark"
            - type: "null"
        note: { type: ["string", "null"] }
    ChildNotebookRow:
      type: object
      required: [onDate, subjectName, state, comment]
      properties:
        onDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        subjectName: { type: ["string", "null"] }
        state:
          $ref: "#/components/schemas/NotebookState"
        comment: { type: ["string", "null"] }
    ChildExamRow:
      type: object
      description: >
        Scores and dates. The questions and the key are never here: a parent
        reading the answers over a child's shoulder is exactly the route by
        which a paper the rest of the class is still sitting leaks.
      required: [sittingId, title, examKind, subjectName, satAt, score, maxScore]
      properties:
        sittingId: { type: integer }
        title: { type: string }
        examKind: { type: string }
        subjectName: { type: string }
        satAt: { type: ["string", "null"] }
        score: { type: ["number", "null"] }
        maxScore: { type: ["number", "null"] }
    ChildTeacherRow:
      type: object
      required: [subjectName, teacherName, isClassTeacher]
      properties:
        subjectName: { type: ["string", "null"] }
        teacherName: { type: string }
        isClassTeacher: { type: boolean }
    ChildRecord:
      type: object
      required: [studentId, from, to, attendance, notebook, exams, teachers]
      properties:
        studentId: { type: integer }
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        attendance:
          type: array
          items:
            $ref: "#/components/schemas/ChildAttendanceRow"
        notebook:
          type: array
          items:
            $ref: "#/components/schemas/ChildNotebookRow"
        exams:
          type: array
          items:
            $ref: "#/components/schemas/ChildExamRow"
        teachers:
          type: array
          items:
            $ref: "#/components/schemas/ChildTeacherRow"
    GuardianAccount:
      type: object
      required: [userId, username, displayName, isActive, children]
      properties:
        userId: { type: integer }
        username: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        children:
          type: array
          items:
            type: object
            required: [studentId, studentName, relation]
            properties:
              studentId: { type: integer }
              studentName: { type: string }
              relation: { type: ["string", "null"] }
    GuardianAccountInput:
      type: object
      description: >
        The password is chosen by the administrator sitting with the parent,
        because this school hands out credentials in person. It is never stored
        in the clear and never returned again: a screen that can re-display a
        password is a screen somebody will leave open.
      required: [username, displayName, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        displayName:
          type: string
          maxLength: 300
        password:
          type: string
          minLength: 8
        studentId:
          description: Link to this child at the same time, which is the ordinary case.
          type: ["integer", "null"]
    GuardianAccountCreated:
      type: object
      required: [userId, username]
      properties:
        userId: { type: integer }
        username: { type: string }
    ClassChild:
      type: object
      required: [studentId, displayName, studentCode, linked]
      properties:
        studentId: { type: integer }
        displayName: { type: string }
        studentCode: { type: string }
        linked:
          description: Whether a live guardian account already reads this child.
          type: boolean
    GuardianLinkInput:
      type: object
      required: [userId, studentId]
      properties:
        userId: { type: integer }
        studentId: { type: integer }
        relation:
          type: ["string", "null"]
          maxLength: 40
    GuardianLinkResult:
      type: object
      required: [linked]
      properties:
        linked: { type: boolean }
    ClubSession:
      type: object
      required: [weekdayNo, periodNo]
      properties:
        weekdayNo:
          description: 1 is Monday, the same numbering the timetable uses.
          type: integer
          minimum: 1
          maximum: 7
        periodNo:
          type: integer
          minimum: 1
          maximum: 12
    Club:
      type: object
      description: >
        Something the school runs that is not a class. The school's own
        timetable writes these into the box where a class name goes, which is
        the only box there was - and it makes them unreadable, because that box
        means "who is in the room" and a club's answer is "whoever signed up,
        from anywhere".
      required: [clubId, nameMn, subjectId, subjectName, teacherId, teacherName, note, isActive, memberCount, sessions]
      properties:
        clubId: { type: integer }
        nameMn: { type: string }
        subjectId: { type: ["integer", "null"] }
        subjectName: { type: ["string", "null"] }
        teacherId: { type: ["integer", "null"] }
        teacherName: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        isActive: { type: boolean }
        memberCount:
          description: >
            The one number that says whether a club is real. A club with hours
            and no members is on nobody's timetable, which from the staff room
            looks exactly like a club that is running fine.
          type: integer
        sessions:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClubSession"
    ClubInput:
      type: object
      required: [nameMn, sessions]
      properties:
        nameMn:
          type: string
          maxLength: 200
        subjectId:
          description: A club need not be a school subject; a chess club is a chess club.
          type: ["integer", "null"]
        teacherId: { type: ["integer", "null"] }
        note:
          type: ["string", "null"]
          maxLength: 1000
        sessions:
          description: At least one. An hour is what makes a club appear anywhere.
          type: array
          items:
            $ref: "#/components/schemas/ClubSession"
    ClubCreated:
      type: object
      required: [clubId]
      properties:
        clubId: { type: integer }
    ClubMember:
      type: object
      required: [studentId, displayName, studentCode, className]
      properties:
        studentId: { type: integer }
        displayName: { type: string }
        studentCode: { type: string }
        className: { type: ["string", "null"] }
    ClubRosterEntry:
      type: object
      required: [studentId, displayName, studentCode, className, gradeNumber]
      properties:
        studentId: { type: integer }
        displayName: { type: string }
        studentCode: { type: string }
        className: { type: ["string", "null"] }
        gradeNumber: { type: ["integer", "null"] }
    ClubMembers:
      type: object
      required: [clubId, nameMn, members, roster]
      properties:
        clubId: { type: integer }
        nameMn: { type: string }
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClubMember"
        roster:
          description: >
            Every child in the school. A club crosses classes, so a screen that
            asked for a class first would be asking the wrong question.
          type: array
          items:
            $ref: "#/components/schemas/ClubRosterEntry"
    ClubMembersInput:
      type: object
      required: [studentIds]
      properties:
        studentIds:
          description: >
            The whole membership, not an addition. A child left out has left
            the club; their row is kept but made inactive, because a child who
            stopped coming in November was in the club in October.
          type: array
          items: { type: integer }
    ClubMembersResult:
      type: object
      required: [members]
      properties:
        members: { type: integer }
    ClubActiveInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    ClubActiveResult:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    HomeworkSummary:
      type: object
      required: [homeworkId, title, instructions, subjectId, subjectName, assignedOn, dueOn, wholeClass, isActive, teacherName, given, handedIn, late]
      properties:
        homeworkId: { type: integer }
        title: { type: string }
        instructions: { type: ["string", "null"] }
        subjectId: { type: integer }
        subjectName: { type: string }
        assignedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        dueOn:
          description: The date it is wanted by, or null. Never a door that locks.
          type: ["string", "null"]
        wholeClass: { type: boolean }
        isActive: { type: boolean }
        teacherName: { type: ["string", "null"] }
        given:
          description: How many children it was set for.
          type: integer
        handedIn:
          description: How many have handed in at least once.
          type: integer
        late:
          description: How many of those first handed in after the date.
          type: integer
    HomeworkInput:
      type: object
      required: [classId, subjectId, title]
      properties:
        classId: { type: integer }
        subjectId: { type: integer }
        title:
          type: string
          maxLength: 300
        instructions:
          type: ["string", "null"]
          maxLength: 4000
        dailyLessonId:
          description: The lesson this hangs off, where it hangs off one.
          type: ["integer", "null"]
        assignedOn:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        dueOn:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        studentIds:
          description: >
            Named children. Empty or absent means the whole class, which is the
            ordinary case - a teacher setting reading for the class should not
            have to tick twenty-eight boxes.
          type: ["array", "null"]
          items: { type: integer }
    HomeworkCreated:
      type: object
      required: [homeworkId, given]
      properties:
        homeworkId: { type: integer }
        given:
          description: How many were named, or null for the whole class.
          type: ["integer", "null"]
    HomeworkAttempt:
      type: object
      required: [submissionId, attemptNo, body, minutes, isLate, submittedAt]
      properties:
        submissionId: { type: integer }
        attemptNo: { type: integer }
        body: { type: ["string", "null"] }
        minutes:
          description: >
            What the browser saw, and approximate by nature - a page left open
            counts, a page thought about on paper does not.
          type: ["integer", "null"]
        isLate: { type: boolean }
        submittedAt: { type: string }
    HomeworkStudent:
      type: object
      required: [studentId, studentName, studentCode, attempts]
      properties:
        studentId: { type: integer }
        studentName: { type: string }
        studentCode: { type: string }
        attempts:
          description: >
            Every go, oldest first. A child who redid the work has done it
            twice, and which of the two counts is the teacher's judgement to
            make from seeing both. Empty where nothing has been handed in - a
            child with no submission is still a row, because "who has not
            handed it in" is the question this screen is usually opened for.
          type: array
          items:
            $ref: "#/components/schemas/HomeworkAttempt"
    HomeworkDetail:
      type: object
      required: [homeworkId, classId, subjectId, title, instructions, assignedOn, dueOn, wholeClass, isActive, students]
      properties:
        homeworkId: { type: integer }
        classId: { type: integer }
        subjectId: { type: integer }
        title: { type: string }
        instructions: { type: ["string", "null"] }
        assignedOn: { type: string }
        dueOn: { type: ["string", "null"] }
        wholeClass: { type: boolean }
        isActive: { type: boolean }
        students:
          type: array
          items:
            $ref: "#/components/schemas/HomeworkStudent"
    HomeworkActiveInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    HomeworkActiveResult:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    StudentHomework:
      type: object
      required: [homeworkId, title, instructions, subjectName, assignedOn, dueOn, teacherName, attempts, lastSubmittedAt, isOverdue]
      properties:
        homeworkId: { type: integer }
        title: { type: string }
        instructions: { type: ["string", "null"] }
        subjectName: { type: string }
        assignedOn: { type: string }
        dueOn: { type: ["string", "null"] }
        teacherName: { type: ["string", "null"] }
        attempts:
          description: How many times this child has handed it in.
          type: integer
        lastSubmittedAt: { type: ["string", "null"] }
        isOverdue:
          description: Past its date and nothing handed in. Still open.
          type: boolean
    StudentHomeworkAttempt:
      type: object
      required: [attemptNo, body, minutes, isLate, submittedAt]
      properties:
        attemptNo: { type: integer }
        body: { type: ["string", "null"] }
        minutes: { type: ["integer", "null"] }
        isLate: { type: boolean }
        submittedAt: { type: string }
    StudentHomeworkDetail:
      type: object
      required: [homeworkId, title, instructions, assignedOn, dueOn, attempts]
      properties:
        homeworkId: { type: integer }
        title: { type: string }
        instructions: { type: ["string", "null"] }
        assignedOn: { type: string }
        dueOn: { type: ["string", "null"] }
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/StudentHomeworkAttempt"
    HomeworkSubmissionInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 20000
        minutes:
          type: ["integer", "null"]
          minimum: 0
    HomeworkSubmitted:
      type: object
      required: [submissionId, attemptNo, isLate]
      properties:
        submissionId: { type: integer }
        attemptNo: { type: integer }
        isLate: { type: boolean }
    AttendanceState:
      description: >
        UNREGISTERED is never stored - it is the absence of a mark - but it may
        be sent, to take one off. "Not registered" and "did not come" are
        different facts about a child, and a school that collapses them tells a
        parent their child truanted when the truth is that nobody took the
        register.
      type: string
      enum: [PRESENT, LATE, ABSENT, EXCUSED, UNREGISTERED]
    ParticipationMark:
      description: >
        A separate axis and deliberately toothless: three words a teacher may
        leave unsaid, worth no marks, and not a second attendance state. A
        child who was present and quiet is present.
      type: string
      enum: [HIGH, GOOD, WATCH]
    AttendanceMark:
      type: object
      description: >
        One verdict on one child. timetableSlotId is null on a whole-day
        register, which is what years 1 to 5 keep.
      required: [timetableSlotId, state, participation, note]
      properties:
        timetableSlotId:
          type: [integer, "null"]
        state:
          $ref: "#/components/schemas/AttendanceState"
        participation:
          oneOf:
            - $ref: "#/components/schemas/ParticipationMark"
            - type: "null"
        note:
          type: ["string", "null"]
    AttendanceInput:
      type: object
      description: >
        A whole register at once, because that is how it is taken: down the
        class, then away. Children left out are left alone - unregistered is a
        fact about the teacher's afternoon, not a verdict on a child.
      required: [classId, onDate, marks]
      properties:
        classId: { type: integer }
        onDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        timetableSlotId:
          description: >
            The period. Required from year 6, where the children move between
            teachers and a register taken in the morning says nothing about
            who was in physics after lunch. Refused up to year 5, where the
            class is with one teacher all day and six registers would be five
            copies of one fact.
          type: [integer, "null"]
        marks:
          type: array
          items:
            type: object
            required: [studentId, state]
            properties:
              studentId: { type: integer }
              state:
                $ref: "#/components/schemas/AttendanceState"
              participation:
                oneOf:
                  - $ref: "#/components/schemas/ParticipationMark"
                  - type: "null"
              note:
                type: ["string", "null"]
                maxLength: 500
    AttendanceResult:
      type: object
      required: [marked]
      properties:
        marked: { type: integer }
    NotebookState:
      description: >
        What the teacher found in the book. UNCHECKED is never stored - it is
        the absence of a mark - but it may be sent, to undo one.
      type: string
      enum: [DONE, PARTIAL, NOT_DONE, UNCHECKED]
    NotebookMark:
      type: object
      description: >
        One period's verdict on one child's exercise book. Keyed by the period,
        because a child can have done the maths and not the physics.
      properties:
        subjectId:
          type: integer
        timetableSlotId:
          type: [integer, "null"]
        state:
          $ref: "#/components/schemas/NotebookState"
        comment:
          description: The teacher's own sentence about this book - the one thing that says why.
          type: ["string", "null"]
      required: [subjectId, timetableSlotId, state, comment]
    ClassDayStudent:
      type: object
      properties:
        studentId:
          type: integer
        studentName:
          type: string
        studentCode:
          type: string
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ClassDayAttempt"
        notebook:
          description: >
            The marks written for this child today, one per period. Empty where
            nobody looked - which is not the same as nothing done, and is the
            reason this is a list rather than a field with a default.
          type: array
          items:
            $ref: "#/components/schemas/NotebookMark"
        attendance:
          description: >
            The register entries for this child today - one for the day up to
            year 5, one per period from year 6. Empty where nobody took it.
          type: array
          items:
            $ref: "#/components/schemas/AttendanceMark"
      required: [studentId, studentName, studentCode, attempts, notebook, attendance]
    NotebookInput:
      type: object
      description: >
        A whole period's marks at once, because that is how the work is done: a
        teacher goes down the register and presses save once. Children left out
        are left alone.
      required: [classId, subjectId, scheduledOn, marks]
      properties:
        classId:
          type: integer
        subjectId:
          type: integer
        scheduledOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        timetableSlotId:
          type: [integer, "null"]
        marks:
          type: array
          items:
            type: object
            required: [studentId, state]
            properties:
              studentId:
                type: integer
              state:
                $ref: "#/components/schemas/NotebookState"
              comment:
                type: ["string", "null"]
                maxLength: 500
    NotebookResult:
      type: object
      required: [marked]
      properties:
        marked:
          type: integer
    ClassDayAttempt:
      type: object
      properties:
        attemptId:
          type: integer
        lessonCode:
          type: ["string", "null"]
        skillName:
          type: ["string", "null"]
        score:
          type: integer
        maxScore:
          type: integer
        submittedAt:
          type: string
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
              prompt:
                type: string
              chosenText:
                type: string
              correct:
                type: boolean
            required: [questionId, prompt, chosenText, correct]
      required: [attemptId, lessonCode, skillName, score, maxScore, submittedAt, answers]
    TeacherQuizPaper:
      type: object
      properties:
        lessonId:
          type: integer
        lessonCode:
          type: string
        skillName:
          type: string
        subjectName:
          type: string
        kind:
          type: string
          enum: [LESSON, UNIT, MONTHLY, DIAGNOSTIC]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/TeacherQuizQuestion"
      required:
        - lessonId
        - lessonCode
        - skillName
        - subjectName
        - kind
        - questions
    TeacherQuizQuestion:
      type: object
      properties:
        itemId:
          type: integer
        prompt:
          type: string
        explanation:
          description: The marking note, where the question carries one.
          type: ["string", "null"]
        options:
          type: array
          items:
            type: object
            properties:
              optionId:
                type: integer
              text:
                type: string
              isCorrect:
                type: boolean
            required: [optionId, text, isCorrect]
      required:
        - itemId
        - prompt
        - explanation
        - options
    QuizAnswer:
      type: object
      description: What the teacher sees afterwards, with the text copied in so it still reads after an edit.
      properties:
        questionId:
          type: string
        prompt:
          type: string
        chosenOptionId:
          type: string
        chosenText:
          type: string
        correct:
          type: boolean
      required: [questionId, prompt, chosenOptionId, chosenText, correct]
    QuizAttemptInput:
      type: object
      description: Only the choices. The server looks up which were right.
      properties:
        lessonId:
          type: integer
        answers:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              itemId:
                type: integer
              optionId:
                type: ["integer", "null"]
            required: [itemId, optionId]
      required: [lessonId, answers]
    QuizResult:
      type: object
      properties:
        itemId:
          type: integer
        correct:
          type: boolean
        correctOptionId:
          type: ["integer", "null"]
        explanation:
          type: ["string", "null"]
      required: [itemId, correct, correctOptionId, explanation]
    QuizAttempt:
      type: object
      properties:
        id:
          type: integer
        lessonCode:
          type: string
        score:
          type: integer
        maxScore:
          type: integer
        submittedAt:
          type: string
        results:
          description: >
            Marking comes back with the attempt. Whether each answer was right
            is always here; the key and the note are filled in only once the
            teacher has released them.
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        attemptsUsed:
          description: Including this one.
          type: integer
        attemptsAllowed:
          type: integer
        answersOpen:
          description: >
            Whether the teacher has released the key. False leaves
            correctOptionId and explanation null on every result.
          type: boolean
      required: [id, lessonCode, score, maxScore, submittedAt, results, attemptsUsed, attemptsAllowed, answersOpen]
    TeacherQuizAttemptRow:
      type: object
      properties:
        id:
          type: integer
        studentId:
          description: Needed to assign this student extra work straight from the row.
          type: integer
        studentName:
          type: string
        studentCode:
          type: string
        lessonCode:
          type: string
        skillName:
          type: string
        kind:
          description: >
            Which sort of assessment this sitting was - the check at the end of
            a lesson, a unit test, a monthly one, a diagnostic. A teacher
            reading a month of results needs the monthly test told apart from
            the daily checks.
          type: string
          enum: [LESSON, UNIT, MONTHLY, DIAGNOSTIC]
        score:
          type: integer
        maxScore:
          type: integer
        submittedAt:
          type: string
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuizAnswer"
      required:
        - id
        - studentId
        - studentName
        - studentCode
        - lessonCode
        - skillName
        - kind
        - score
        - maxScore
        - submittedAt
        - answers
    TeacherQuizAttempts:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        from:
          description: The range actually applied, null where there was no bound.
          type: ["string", "null"]
        to:
          type: ["string", "null"]
        truncated:
          description: >
            True when the limit cut the list short, so the totals below it are
            of what came back rather than of the range asked for.
          type: boolean
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/TeacherQuizAttemptRow"
      required: [classId, className, from, to, truncated, attempts]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          description: At least 8 characters. No composition rules - length is what matters.
          type: string
          minLength: 8
      required: [currentPassword, newPassword]
    BookReference:
      type: object
      description: Where in the book this lesson sits.
      properties:
        materialId:
          type: integer
        title:
          type: ["string", "null"]
        chapterTitle:
          type: ["string", "null"]
        pageFrom:
          type: ["integer", "null"]
        pageTo:
          type: ["integer", "null"]
        filePage:
          description: >
            Which page of the file to open at. Not the same as pageFrom: a
            scanned book carries covers and front matter the printed numbering
            does not count, so printed page 3 can be file page 9. The student
            is shown the printed numbers and the viewer opens the file page.
          type: ["integer", "null"]
        fileUrl:
          type: ["string", "null"]
      required: [materialId, title, chapterTitle, pageFrom, pageTo, filePage, fileUrl]
    DailyLessonView:
      type: object
      properties:
        id:
          type: integer
        lessonCode:
          type: string
        lessonType:
          type: string
          enum: [CORE, RECOVERY, REINFORCE]
        skillName:
          type: string
        learningGoal:
          type: ["string", "null"]
        remember:
          type: ["string", "null"]
        workedExample:
          type: ["string", "null"]
        guidedPractice:
          type: ["string", "null"]
        independentPractice:
          type: ["string", "null"]
        studentMessage:
          type: ["string", "null"]
        teacherNote:
          description: >
            The note the teacher left on this day of the timetable, if any. It
            belongs to the class's day rather than to the lesson, so the same
            lesson taught to another class on another day carries a different
            one - and a lesson reached outside the timetable carries none.
          type: ["string", "null"]
        estimatedMinutes:
          type: ["integer", "null"]
        book:
          oneOf:
            - $ref: "#/components/schemas/BookReference"
            - type: "null"
      required:
        - id
        - lessonCode
        - lessonType
        - skillName
        - learningGoal
        - remember
        - workedExample
        - guidedPractice
        - independentPractice
        - studentMessage
        - teacherNote
        - estimatedMinutes
        - book
    StudentToday:
      type: object
      properties:
        date:
          description: Calendar date, YYYY-MM-DD. Not an instant, so not format:date.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        dateLabel:
          type: string
        className:
          type: string
        slots:
          description: >
            One entry per period on the class's timetable, in bell order. Not
            one per subject: Mongolian in the first period and again in the
            second is two lessons, and a day with the same subject twice used
            to come back as one. A split class puts two entries on one period,
            which is what a split is.
          type: array
          items:
            $ref: "#/components/schemas/SubjectDay"
        notice:
          type: string
      required: [date, dateLabel, className, slots, notice]
    SubjectDay:
      type: object
      properties:
        timetableSlotId:
          type: [integer, "null"]

        selectionPending:
          type: boolean
          description: Group membership has not yet been assigned by staff.

        subjectCode:
          type: string
        subjectName:
          type: string
        startsAt:
          description: Bell time, HH:MM. Null where the school has no period list.
          type: [string, "null"]
        endsAt:
          type: [string, "null"]
        teacherName:
          description: Who takes this period, from the school's own timetable.
          type: [string, "null"]
        groupLabel:
          description: >
            Which half of a split class this slot is for, in the school's own
            words ("6а-1"). Null for a lesson the whole class attends.
          type: [string, "null"]
        club:
          description: >
            The club that meets in this period, where the child is in one. A
            club has no class, so it reaches a child's day through their own
            membership and nobody else's.
          oneOf:
            - type: object
              required: [clubId, nameMn, teacherName, note]
              properties:
                clubId: { type: integer }
                nameMn: { type: string }
                teacherName: { type: ["string", "null"] }
                note: { type: ["string", "null"] }
            - type: "null"
        notebook:
          description: >
            What the teacher found in this child's exercise book for this
            period, or null where nobody has looked. Null is not "nothing
            done": most periods are never marked, and a child should not read
            silence as a verdict.
          oneOf:
            - type: object
              required: [state, comment]
              properties:
                state:
                  $ref: "#/components/schemas/NotebookState"
                comment:
                  type: ["string", "null"]
            - type: "null"
        held:
          description: >
            False where the teacher struck this period off. The lesson then
            comes back null whatever was planned for it, and notHeldReason says
            why - there is nothing to study, and nothing to be checked on, in
            an hour that did not take place.
          type: boolean
        notHeldReason:
          type: ["string", "null"]
        isContinuation:
          description: >
            This period carried the previous one on. The child is being told to
            pick the book up, not to open it.
          type: boolean
        lesson:
          description: >
            What the class is scheduled to study in this subject today, or null
            where nobody has written the lesson yet - which is most periods. A
            timetable slot is owed to a child whether or not its content exists.
            Null too where the period was struck off.
          oneOf:
            - $ref: "#/components/schemas/DailyLessonView"
            - type: "null"
        extra:
          description: >
            Work assigned to this student personally in this subject. Where the
            class works through one book it is remediation on top; where the
            subject places students by level it is the whole of the day's work.
          oneOf:
            - $ref: "#/components/schemas/ExtraWork"
            - type: "null"
        periodNo:
          description: >
            Which slot in the day the class lesson sits in, matching a row of
            /school/periods. Null where the school has supplied no timetable,
            or where the day's only work is the personal kind, which answers to
            no bell.
          type: ["integer", "null"]
      required:
        [subjectCode, subjectName, startsAt, endsAt, teacherName, groupLabel,
         lesson, extra, periodNo]
    SubjectOutlineSection:
      type: object
      properties:
        nodeId: {type: string}
        printedNumber: {type: [string, "null"]}
        title: {type: string}
        pageFrom: {type: [integer, "null"]}
        pageTo: {type: [integer, "null"]}
        periodNo: {type: [integer, "null"]}
        position:
          description: Place in book order, counting from one.
          type: integer
        isCurrent:
          description: The section the teacher says the class is on right now.
          type: boolean
        isPast:
          description: Earlier in the book than the class's current section.
          type: boolean
      required:
        [nodeId, printedNumber, title, pageFrom, pageTo, periodNo, position,
         isCurrent, isPast]
    SubjectOutline:
      type: object
      description: >-
        currentPosition is the CLASS's place in the book, not the reader's own
        progress. Nothing here measures the individual: no skill has been
        mapped to a section yet, and no child has been assessed against one.
      properties:
        subjectCode: {type: string}
        subjectName: {type: string}
        bookTitle: {type: [string, "null"]}
        materialId:
          description: The book's id, for the file endpoint. Null when no book.
          type: [string, "null"]
        pageOffset:
          description: >-
            Add this to a printed page number to reach the same page in the
            PDF. Front matter means the two rarely agree.
          type: integer
        totalSections: {type: integer}
        currentPosition: {type: [integer, "null"]}
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SubjectOutlineSection"
        teachers:
          description: Who teaches this child this subject, for the card.
          type: array
          items:
            $ref: "#/components/schemas/SubjectTeacher"
      required:
        [subjectCode, subjectName, bookTitle, materialId, pageOffset, teachers,
         totalSections, currentPosition, sections]
    SchoolPeriod:
      type: object
      description: One slot in the school day, from the bell schedule.
      properties:
        periodNo: {type: integer}
        nameMn: {type: [string, "null"]}
        startsAt:
          description: Wall-clock start, HH:MM.
          type: string
        endsAt:
          type: string
      required: [periodNo, nameMn, startsAt, endsAt]
    ScheduledDay:
      type: object
      properties:
        periodNo:
          type: [integer, "null"]
        groupLabel:
          type: [string, "null"]
        startsAt:
          type: [string, "null"]
        teacherName:
          type: [string, "null"]

        timetableSlotId:
          type: [integer, "null"]
          minimum: 1

        scheduledOn:
          description: Calendar date, YYYY-MM-DD.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isToday:
          type: boolean
        subjectId:
          description: >
            The subject this row's lesson belongs to, null on a day nothing is
            scheduled for. A day appears once per subject taught that day, so
            this is what tells two rows of the same date apart.
          type: ["integer", "null"]
        subject:
          type: ["string", "null"]
        lessonId:
          description: Null on a teaching day nothing is scheduled for yet.
          type: ["integer", "null"]
        lessonCode:
          type: ["string", "null"]
        lessonType:
          type: ["string", "null"]
        skillName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        held:
          description: >
            False where the teacher struck the period off. The section stays on
            the day so it can be read back, but nothing was taught: it falls
            into the plan again and the class gets it another day.
          type: boolean
        notHeldReason:
          type: ["string", "null"]
        isContinuation:
          description: The period carried the previous one on.
          type: boolean
      required:
        [scheduledOn, isToday, subjectId, subject, lessonId, lessonCode,
         lessonType, skillName, note]
    TeacherSchedule:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        gradeLevel:
          type: integer
        stage:
          type: string
          enum: [PRIMARY, LOWER_SECONDARY, UPPER_SECONDARY]
          description: >
            Derived from the class's grade, not stored on the teacher: the two
            workflows differ per class, and one teacher may hold both.
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledDay"
      required: [classId, className, gradeLevel, stage, days]
    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN, GUARDIAN]
    AuthenticatedUser:
      type: object
      description: >
        Roles are a list: one account can hold TEACHER and ADMIN at once.
        studentId and teacherId are the linked core.students / core.teachers
        rows, null when the account has none.
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        studentId:
          type: ["integer", "null"]
        teacherId:
          type: ["integer", "null"]
        photoUrl:
          description: >
            Where to fetch this person's own photograph, or null when they
            have none. Carried on the session because the shell draws the
            avatar on every screen and would otherwise ask separately each
            time.
          type: ["string", "null"]
        takesLessons:
          type: boolean
          description: >
            Whether this account actually takes any lesson anywhere. A class
            teacher who takes none of their class's subjects still sees the
            class, but the screens for entering things - the register, the
            review queue - have nothing in them for such an account, so the
            navigation leaves them out rather than offering a page that
            refuses.
