openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EJ Learning adaptive learning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sign-in and the current session
  - name: content
    description: Source materials and their files
  - name: admin
    description: Configuration a school administrator owns
  - name: session
    description: Current authenticated identity
  - name: student
    description: Student learning journey
  - name: teacher
    description: Teacher classroom and review workflow
paths:
  /preview/students:
    get:
      operationId: getPreviewStudents
      tags: [teacher]
      summary: Read-only local database preview
      responses:
        "200":
          description: Database records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreviewStudent"
  /teacher/catalog:
    get:
      operationId: getTeacherCatalog
      tags: [teacher]
      summary: Read-only local database preview
      responses:
        "200":
          description: Database records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
  /student/subjects:
    get:
      operationId: getStudentSubjects
      tags: [student]
      summary: Read-only local database preview
      responses:
        "200":
          description: Database records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectOverview"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session/me:
    get:
      operationId: getCurrentUser
      tags: [session]
      summary: Get the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /student/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Get the student's daily work
      responses:
        "200":
          description: Student dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
  /student/assignments/{assignmentId}:
    get:
      operationId: getStudentAssignment
      tags: [student]
      summary: Get an assignment and its learning material
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentDetail"
        "404":
          description: Assignment not found
  /student/assignments/{assignmentId}/start:
    post:
      operationId: startStudentAssignment
      tags: [student]
      summary: Start or resume an assignment
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentState"
  /student/assignments/{assignmentId}/steps:
    post:
      operationId: saveStudentAssignmentStep
      tags: [student]
      summary: Save reading, example, or practice step progress
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentStepInput"
      responses:
        "200":
          description: Saved step progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentState"
  /student/assignments/{assignmentId}/submit:
    post:
      operationId: submitStudentAssignment
      tags: [student]
      summary: Submit an understanding check
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentSubmissionInput"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Invalid submission
  /student/progress:
    get:
      operationId: getStudentProgress
      tags: [student]
      summary: Get skill progress and attempt history
      responses:
        "200":
          description: Student progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"
  /teacher/dashboard:
    get:
      operationId: getTeacherDashboard
      tags: [teacher]
      summary: Get teacher dashboard summary
      responses:
        "200":
          description: Teacher dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
  /teacher/classes:
    get:
      operationId: getTeacherClasses
      tags: [teacher]
      summary: List authorized classes
      responses:
        "200":
          description: Authorized classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherClass"
  /teacher/review-queue:
    get:
      operationId: getTeacherReviewQueue
      tags: [teacher]
      summary: List written answers awaiting review
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"
  /teacher/reviews/{attemptId}:
    post:
      operationId: reviewTeacherAttempt
      tags: [teacher]
      summary: Review a written answer using the rubric
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: Reviewed attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
  /teacher/current-topic:
    post:
      operationId: setTeacherCurrentTopic
      tags: [teacher]
      summary: Set the current topic for an authorized class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentTopicInput"
      responses:
        "200":
          description: Current topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentTopic"
  /teacher/integrations/workspace:
    get:
      operationId: getWorkspaceIntegrationDashboard
      tags: [teacher]
      summary: Get the mock Google Workspace integration model and audit state
      responses:
        "200":
          description: Workspace integration dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceIntegrationDashboard"
  /teacher/integrations/workspace/simulate:
    post:
      operationId: simulateWorkspaceIntegration
      tags: [teacher]
      summary: Simulate an idempotent Classroom, Sheets, Drive, or coursework operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSimulationInput"
      responses:
        "200":
          description: Updated workspace integration dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceIntegrationDashboard"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in and start a session
      description: >
        On success the session token is returned as an httpOnly cookie, never
        in the body. A wrong password and an unknown username give the same
        401 so neither can be probed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          description: Username or password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked and the cookie cleared
  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      summary: The signed-in user
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/today:
    get:
      operationId: getStudentToday
      tags: [student]
      summary: The lesson scheduled for the signed-in student today
      responses:
        "200":
          description: Today's lesson, or none when nothing is scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentToday"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not linked to a student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/schedule:
    get:
      operationId: getStudentSchedule
      tags: [student]
      summary: The signed-in student's class lessons and personal work for one day
      parameters:
        - name: date
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date in Ulaanbaatar, defaults to today
      responses:
        "200":
          description: The student's own schedule for the selected day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentToday"
        "400":
          description: Invalid calendar date
        "401":
          description: Not signed in
        "403":
          description: Not a linked student
  /teacher/schedule:
    get:
      operationId: getTeacherSchedule
      tags: [teacher]
      summary: A class's calendar days and subject slots, including blank and weekend rows
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: Inclusive start date (YYYY-MM-DD). Defaults to seven days ago.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          description: Inclusive end date (YYYY-MM-DD). Defaults to fourteen days ahead.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Scheduled days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherSchedule"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /content/materials/{materialId}/file:
    get:
      operationId: getMaterialFile
      tags: [content]
      summary: The approved file for a source material
      description: >
        Streams the stored file, currently always a PDF. Viewers accept a
        #page=N fragment, so a lesson can open the book at its own pages.
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: No approved version, or the stored file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in account's password
      description: >
        Every other session for the account is revoked, so a password changed
        because it leaked actually locks the other holder out. The session
        making the change survives, so the user is not signed out of the tab
        they are working in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed and other sessions revoked
        "400":
          description: The new password fails the length rule, or repeats the old one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in, or the current password is wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/quiz-attempts:
    post:
      operationId: submitQuizAttempt
      tags: [student]
      summary: Record the signed-in student's run at a lesson's practice check
      description: >
        The server scores nothing: the questions live in the frontend for now,
        so it records what was answered and trusts the client's marking. That
        is fine for practice a student marks themselves and would not be for a
        graded assessment - the diagnostic block moves questions into the
        database and the scoring with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "201":
          description: Attempt recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttempt"
        "400":
          description: Malformed attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not linked to a student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/quiz-attempts:
    get:
      operationId: getTeacherQuizAttempts
      tags: [teacher]
      summary: What a class answered, newest first
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: >
            Earliest calendar day to include, YYYY-MM-DD, read in
            Asia/Ulaanbaatar. Omitted means no lower bound.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          description: Latest calendar day to include, inclusive.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recorded attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherQuizAttempts"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/assessment-sheet:
    get:
      operationId: getAssessmentSheet
      tags: [teacher]
      summary: The register for marking a paper assessment
      description: >
        Primary grades do the monthly assessment in a notebook, so nothing
        reaches the system until a teacher has marked it. Returns the skills
        this class may be marked against and where every student currently
        stands on the one chosen. A student nobody has assessed is present
        with empty values rather than absent.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
        - name: skillId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSheet"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/assessments:
    post:
      operationId: submitAssessment
      tags: [teacher]
      summary: Record a teacher's own marking of a paper assessment
      description: >
        The level may be given without a score. That is the teacher overriding
        the arithmetic, which the requirements ask for by name, and demanding
        a percentage would put a number in the database nobody measured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSubmission"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitAssessmentResult"
        "400":
          description: A skill or student that does not belong to the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/item-analysis:
    get:
      operationId: getItemAnalysis
      tags: [teacher]
      summary: Which questions a class got wrong, worst first
      description: >
        One row per student per question, their most recent answer, so a
        student who retook a quiz four times cannot outvote four students who
        took it once. The most-chosen wrong answer comes with it: a distractor
        that attracts half the class is a specific misunderstanding rather than
        a gap, and the two need different teaching.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-question results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemAnalysis"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/class-skills:
    get:
      operationId: getClassSkills
      tags: [teacher]
      summary: How a class stands on each skill it has been measured on
      description: >
        Drawn from the answers students have already given, not from a separate
        exam. A skill nobody has attempted is absent rather than reported as
        zero, so the list only ever contains skills there is evidence about.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
      responses:
        "200":
          description: Skill standing for the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassSkills"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/lessons:
    get:
      operationId: getTeacherLessons
      tags: [teacher]
      summary: Approved lessons for a class, in the order the book teaches them
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: integer
        - name: subjectId
          in: query
          required: false
          description: >
            Narrow to one subject the teacher holds in this class. Omitted
            means every subject they hold there, which for a class teacher or
            a primary-grade teacher is every subject the class runs.
          schema:
            type: integer
      responses:
        "200":
          description: Lessons the class can be scheduled
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulableLesson"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/schedule/generate:
    post:
      operationId: generateSchedule
      tags: [teacher]
      summary: Fill a term's empty school days from the book's own order
      description: >
        The sequence is already fixed by the textbook and the curriculum, so it
        is laid out rather than typed in. Days that already carry a lesson are
        left alone: regenerating must never discard a teacher's correction.
        Weekends are skipped; holidays are not modelled yet, so a teacher
        clears those days by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScheduleInput"
      responses:
        "200":
          description: What was laid out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateScheduleResult"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/schedule/day:
    put:
      operationId: setScheduleDay
      tags: [teacher]
      summary: Set, replace or clear one day's lesson
      description: >
        The teacher's correction surface. A null lessonId clears the day, which
        is how a holiday or a school event is recorded. Weekend lessons may only
        be assigned, changed, or cleared by an administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleDayInput"
      responses:
        "204":
          description: Day updated
        "400":
          description: Malformed day or a lesson that is not schedulable here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials:
    get:
      operationId: getAdminMaterials
      tags: [admin]
      summary: Source materials with their file and outline state
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMaterial"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/skill-map:
    get:
      operationId: getSkillMap
      tags: [admin]
      summary: Which topics carry which skills, and what is missing
      description: >
        Read-only. Nothing in the product shows this mapping today, yet every
        lesson reaches its book pages through it and every mastery score is
        keyed on the skill it names. An import that lands the topics and the
        skills but drops the links between them leaves a system that can
        timetable lessons and cannot measure anything - and there is currently
        no way to see that has happened short of writing SQL.
      responses:
        "200":
          description: The mapping and its gaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMap"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/skill-chain:
    get:
      operationId: getSkillChain
      tags: [admin]
      summary: Which skill a skill depends on, and whether the chain works
      description: >
        Read-only. The remediation walk follows these links to decide what a
        struggling child should study instead, five levels back at most, and
        until now nothing in the product showed them. Three things about the
        chain are invisible and each breaks it silently: a link that is not
        REQUIRED and APPROVED is never followed, a prerequisite with no
        approved web-ready lesson ends the walk, and a cycle is only stopped by
        the depth limit - the database blocks a skill pointing at itself and
        nothing more.
      responses:
        "200":
          description: The chain, with the links that do nothing marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillChain"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials/{materialId}/file/{filename}:
    post:
      operationId: uploadMaterialFile
      tags: [admin]
      summary: Upload a textbook PDF as a new version of this material
      description: >
        The bytes are checked, not the filename: a file is accepted because it
        starts with %PDF-. Versions are added rather than replaced, because
        outline rows and lesson alignments were made against the page numbers
        of the file already stored. The page offset is set separately, since it
        is nearly always discovered after looking at the book.
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
        - name: filename
          in: path
          required: true
          description: >
            The original name, recorded as a column. It never becomes part of a
            path on disk - the stored file is named from the material's own
            source_code.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Not a PDF, empty, or no such material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials/{materialId}/page-offset:
    put:
      operationId: setMaterialPageOffset
      tags: [admin]
      summary: Correct the gap between printed and file page numbers
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageOffsetInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOffsetInput"
        "400":
          description: No file uploaded for this material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/materials/{materialId}/outline:
    get:
      operationId: getMaterialOutline
      tags: [admin]
      summary: A material's sections and page mapping
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialOutline"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveMaterialOutline
      tags: [admin]
      summary: Save the sections and the printed-to-file page offset
      description: >
        Sections are matched on outlineCode: known codes are updated, new ones
        inserted. Nothing is deleted here, because a section can already be
        aligned to content and to lessons, and silently dropping it would
        leave those pointing at nothing.
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialOutlineInput"
      responses:
        "200":
          description: Saved outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialOutline"
        "400":
          description: A page range outside the file, or a duplicate code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teacher/assignments:
    post:
      operationId: assignExtraWork
      tags: [teacher]
      summary: Give one student extra work on a day
      description: >
        Recorded as a TEACHER assignment rather than an AUTO one, so the
        algorithm that will later place remediation itself can be told to leave
        a teacher's choice alone. One assignment per student per day: assigning
        again replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtraWorkInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraWorkResult"
        "400":
          description: A lesson the student's class cannot be taught, or a bad date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a teacher of that student's class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /term/current:
    get:
      operationId: getCurrentTerm
      tags: [session]
      summary: The term today falls in
      description: >
        Read from learning.terms rather than worked out from the month: the
        school sets its own term boundaries each year and they move. Null when
        today falls outside every recorded term, which is what a holiday
        between terms looks like, and what an unseeded database looks like too.
      responses:
        "200":
          description: The term, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Term"
                  - type: "null"
  /student/plan:
    get:
      operationId: getStudentPlan
      tags: [student]
      summary: What this student wrote for themselves for a day
      description: >
        The child's own plan, which is not the school's work. Free text and
        private to them: no teacher endpoint reads this, and none should until
        somebody decides a teacher ought to see it.
      parameters:
        - name: date
          in: query
          required: false
          description: Defaults to today in Ulaanbaatar.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: The plan, empty when nothing has been written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPlan"
        "400":
          description: A date that is not a date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveStudentPlan
      tags: [student]
      summary: Write or replace a day's plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentPlanInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPlan"
        "400":
          description: A bad date, or more text than the column takes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /student/quiz/{lessonId}:
    get:
      operationId: getQuizPaper
      tags: [student]
      summary: The questions for a lesson, without the answers
      description: >
        The key is never sent. It used to live in the frontend bundle, where
        any student could read it, and it stays on the server now so that a
        score means something.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizPaper"
        "403":
          description: A lesson this student is not assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ExtraWork:
      type: object
      properties:
        lesson:
          $ref: "#/components/schemas/DailyLessonView"
        source:
          type: string
          enum: [AUTO, TEACHER]
        reason:
          type: ["string", "null"]
      required: [lesson, source, reason]
    ExtraWorkInput:
      type: object
      properties:
        studentId:
          type: integer
        lessonId:
          type: integer
        assignedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reason:
          type: ["string", "null"]
      required: [studentId, lessonId, assignedOn, reason]
    ExtraWorkResult:
      type: object
      properties:
        studentName:
          type: string
        lessonCode:
          type: string
        skillName:
          type: string
        assignedOn:
          type: string
      required: [studentName, lessonCode, skillName, assignedOn]
    UploadedFile:
      type: object
      properties:
        materialId:
          type: integer
        versionNo:
          type: integer
        filename:
          type: string
        sizeBytes:
          type: integer
        totalPages:
          description: Counted from the file, approximate. The outline is what page numbers are read from.
          type: ["integer", "null"]
        pageOffset:
          type: integer
      required: [materialId, versionNo, filename, sizeBytes, totalPages, pageOffset]
    PageOffsetInput:
      type: object
      properties:
        materialId:
          type: integer
        pageOffset:
          type: integer
      required: [materialId, pageOffset]
    SkillChainLink:
      type: object
      properties:
        dependencyCode:
          type: string
        skillCode:
          type: string
        skillName:
          type: string
        prerequisiteCode:
          type: string
        prerequisiteName:
          type: string
        subjectName:
          type: string
        relationType:
          description: >
            REQUIRED or RECOMMENDED. Only REQUIRED is walked; a RECOMMENDED
            link is a note for whoever plans a year.
          type: string
        importance:
          description: Recorded, but the remediation walk does not read it.
          type: string
        status:
          type: string
        reason:
          description: Why this prerequisite. The column is NOT NULL, so there is always one.
          type: string
        followed:
          description: >
            True when this link is both APPROVED and REQUIRED - that is, when
            remediation actually walks it. Everything else is documentation.
          type: boolean
        prerequisiteHasLesson:
          description: >
            Whether the prerequisite has an approved, web-ready lesson. Without
            one the walk reaches a dead end and keeps looking further back.
          type: boolean
      required:
        - dependencyCode
        - skillCode
        - skillName
        - prerequisiteCode
        - prerequisiteName
        - subjectName
        - relationType
        - importance
        - status
        - reason
        - followed
        - prerequisiteHasLesson
    SkillChain:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/SkillChainLink"
        cycles:
          description: >
            Loops among the followed links, each given as the skill codes
            around it. The database only forbids a skill pointing at itself, so
            a two-step loop is possible; the walk survives it on the depth
            limit alone and returns nonsense.
          type: array
          items:
            type: array
            items:
              type: string
      required: [links, cycles]
    SkillMapSkill:
      type: object
      properties:
        skillCode:
          type: string
        name:
          type: string
        status:
          description: The skill's own review status. Only APPROVED skills reach a student.
          type: string
        isPrimary:
          description: >
            The one skill a topic is mainly about. It decides which book pages
            open with the lesson, so a topic carrying two of them is a fault
            even though the database permits it.
          type: boolean
        mapStatus:
          description: >
            The link's own review status, separate from the skill's. Anything
            but APPROVED is invisible to students.
          type: string
        lessonCount:
          type: integer
      required: [skillCode, name, status, isPrimary, mapStatus, lessonCount]
    SkillMapNode:
      type: object
      properties:
        contentCode:
          type: string
        name:
          type: string
        levelType:
          description: DOMAIN, UNIT, TOPIC, SUBTOPIC or SEGMENT.
          type: string
        subjectName:
          type: string
        status:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillMapSkill"
      required: [contentCode, name, levelType, subjectName, status, skills]
    SkillMapOrphanSkill:
      type: object
      properties:
        skillCode:
          type: string
        name:
          type: string
        subjectName:
          type: string
        status:
          type: string
        lessonCount:
          description: >
            Lessons written against a skill no topic carries. They can be
            taught, but nothing will find them a page in a book.
          type: integer
      required: [skillCode, name, subjectName, status, lessonCount]
    SkillMap:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/SkillMapNode"
        unmappedSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillMapOrphanSkill"
      required: [nodes, unmappedSkills]
    AdminMaterial:
      type: object
      properties:
        id:
          type: integer
        sourceCode:
          type: string
        title:
          type: ["string", "null"]
        subjectName:
          type: string
        status:
          type: string
        hasFile:
          type: boolean
        filePages:
          type: ["integer", "null"]
        pageOffset:
          type: integer
        sectionCount:
          type: integer
      required:
        - id
        - sourceCode
        - title
        - subjectName
        - status
        - hasFile
        - filePages
        - pageOffset
        - sectionCount
    OutlineSection:
      type: object
      properties:
        id:
          type: ["integer", "null"]
        outlineCode:
          type: string
        printedNumber:
          type: ["string", "null"]
        title:
          type: string
        pageFrom:
          type: ["integer", "null"]
        pageTo:
          type: ["integer", "null"]
        sequenceNo:
          type: integer
        usedByLessons:
          description: How many lessons point at this section. Above zero means editing it moves real work.
          type: integer
      required:
        - id
        - outlineCode
        - printedNumber
        - title
        - pageFrom
        - pageTo
        - sequenceNo
        - usedByLessons
    MaterialOutline:
      type: object
      properties:
        materialId:
          type: integer
        title:
          type: ["string", "null"]
        pageOffset:
          type: integer
        filePages:
          type: ["integer", "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/OutlineSection"
      required: [materialId, title, pageOffset, filePages, sections]
    MaterialOutlineInput:
      type: object
      properties:
        pageOffset:
          type: integer
          minimum: 0
        sections:
          type: array
          items:
            type: object
            properties:
              outlineCode:
                type: string
                minLength: 1
              printedNumber:
                type: ["string", "null"]
              title:
                type: string
                minLength: 1
              pageFrom:
                type: ["integer", "null"]
              pageTo:
                type: ["integer", "null"]
              sequenceNo:
                type: integer
            required: [outlineCode, printedNumber, title, pageFrom, pageTo, sequenceNo]
      required: [pageOffset, sections]
    SchedulableLesson:
      type: object
      properties:
        id:
          type: integer
        lessonCode:
          type: string
        lessonType:
          type: string
        skillName:
          type: string
        chapterTitle:
          type: ["string", "null"]
        pageFrom:
          type: ["integer", "null"]
      required: [id, lessonCode, lessonType, skillName, chapterTitle, pageFrom]
    GenerateScheduleInput:
      type: object
      properties:
        classId:
          type: integer
        subjectId:
          type: ["integer", "null"]
          description: >
            Lay out one subject's term. Null means every subject the teacher
            holds in this class.
        termId:
          description: >
            Which term to lay out. Omit it for the term today falls in, which
            is what a teacher pressing the button means.
          type: ["integer", "null"]
      required: [classId]
    GenerateScheduleResult:
      type: object
      properties:
        created:
          type: integer
        skipped:
          description: School days that already carried a lesson and were left alone.
          type: integer
        lessonsAvailable:
          type: integer
        firstDay:
          type: ["string", "null"]
        lastDay:
          type: ["string", "null"]
        notice:
          type: string
      required: [created, skipped, lessonsAvailable, firstDay, lastDay, notice]
    ScheduleDayInput:
      type: object
      properties:
        classId:
          type: integer
        subjectId:
          type: ["integer", "null"]
          description: >
            Which subject's day this is. Setting a lesson takes the subject
            from the lesson itself, so this only matters when clearing: without
            it, emptying Tuesday in the maths timetable would also empty
            Tuesday's physics. Null clears every subject the teacher holds in
            the class.
        scheduledOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        lessonId:
          description: null clears the day.
          type: ["integer", "null"]
        note:
          description: >
            What the teacher wants the class to know about this day - which
            pages to read, which exercises to do, what to watch out for. The
            student sees it. Leave the field out to keep whatever note is
            already there; send null or an empty string to remove it. Clearing
            the day removes the note with it.
          type: ["string", "null"]
          maxLength: 2000
      required: [classId, scheduledOn, lessonId]
    QuizOption:
      type: object
      properties:
        optionId:
          type: integer
        text:
          type: string
      required: [optionId, text]
    QuizQuestion:
      type: object
      properties:
        itemId:
          type: integer
        prompt:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuizOption"
      required: [itemId, prompt, options]
    Term:
      type: object
      properties:
        schoolYear:
          type: string
        termNumber:
          type: integer
        name:
          type: string
        startsOn:
          type: string
        endsOn:
          type: string
      required: [schoolYear, termNumber, name, startsOn, endsOn]
    StudentPlan:
      type: object
      properties:
        date:
          type: string
        body:
          description: Empty string when the day has no plan; there is no separate null.
          type: string
      required: [date, body]
    StudentPlanInput:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        body:
          description: Blank or whitespace removes the day's plan.
          type: string
          maxLength: 2000
      required: [date, body]
    QuizPaper:
      type: object
      properties:
        lessonId:
          type: integer
        lessonCode:
          type: string
        skillName:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        kind:
          description: >
            Which sort of assessment this is - the check at the end of a
            lesson, a unit test, a monthly one, a diagnostic. Recorded against
            the lesson that carries the questions; it is not yet an assessment
            of its own, with an owner and a window.
          type: string
          enum: [LESSON, UNIT, MONTHLY, DIAGNOSTIC]
        takenToday:
          description: >
            Whether this student has already sat this quiz today. A quiz may be
            taken once a day, so the paper says so up front rather than letting
            a child answer everything again and be refused at the end.
          type: boolean
        previousScore:
          type: ["integer", "null"]
        previousMaxScore:
          type: ["integer", "null"]
      required:
        - lessonId
        - lessonCode
        - skillName
        - questions
        - kind
        - takenToday
        - previousScore
        - previousMaxScore
    QuizAnswer:
      type: object
      description: What the teacher sees afterwards, with the text copied in so it still reads after an edit.
      properties:
        questionId:
          type: string
        prompt:
          type: string
        chosenOptionId:
          type: string
        chosenText:
          type: string
        correct:
          type: boolean
      required: [questionId, prompt, chosenOptionId, chosenText, correct]
    QuizAttemptInput:
      type: object
      description: Only the choices. The server looks up which were right.
      properties:
        lessonId:
          type: integer
        answers:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              itemId:
                type: integer
              optionId:
                type: ["integer", "null"]
            required: [itemId, optionId]
      required: [lessonId, answers]
    QuizResult:
      type: object
      properties:
        itemId:
          type: integer
        correct:
          type: boolean
        correctOptionId:
          type: ["integer", "null"]
        explanation:
          type: ["string", "null"]
      required: [itemId, correct, correctOptionId, explanation]
    QuizAttempt:
      type: object
      properties:
        id:
          type: integer
        lessonCode:
          type: string
        score:
          type: integer
        maxScore:
          type: integer
        submittedAt:
          type: string
        results:
          description: Marking comes back with the attempt, which is the first time the key is disclosed.
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
      required: [id, lessonCode, score, maxScore, submittedAt, results]
    TeacherQuizAttemptRow:
      type: object
      properties:
        id:
          type: integer
        studentId:
          description: Needed to assign this student extra work straight from the row.
          type: integer
        studentName:
          type: string
        studentCode:
          type: string
        lessonCode:
          type: string
        skillName:
          type: string
        score:
          type: integer
        maxScore:
          type: integer
        submittedAt:
          type: string
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuizAnswer"
      required:
        - id
        - studentId
        - studentName
        - studentCode
        - lessonCode
        - skillName
        - score
        - maxScore
        - submittedAt
        - answers
    TeacherQuizAttempts:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        from:
          description: The range actually applied, null where there was no bound.
          type: ["string", "null"]
        to:
          type: ["string", "null"]
        truncated:
          description: >
            True when the limit cut the list short, so the totals below it are
            of what came back rather than of the range asked for.
          type: boolean
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/TeacherQuizAttemptRow"
      required: [classId, className, from, to, truncated, attempts]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          description: At least 8 characters. No composition rules - length is what matters.
          type: string
          minLength: 8
      required: [currentPassword, newPassword]
    BookReference:
      type: object
      description: Where in the book this lesson sits.
      properties:
        materialId:
          type: integer
        title:
          type: ["string", "null"]
        chapterTitle:
          type: ["string", "null"]
        pageFrom:
          type: ["integer", "null"]
        pageTo:
          type: ["integer", "null"]
        filePage:
          description: >
            Which page of the file to open at. Not the same as pageFrom: a
            scanned book carries covers and front matter the printed numbering
            does not count, so printed page 3 can be file page 9. The student
            is shown the printed numbers and the viewer opens the file page.
          type: ["integer", "null"]
        fileUrl:
          type: ["string", "null"]
      required: [materialId, title, chapterTitle, pageFrom, pageTo, filePage, fileUrl]
    DailyLessonView:
      type: object
      properties:
        id:
          type: integer
        lessonCode:
          type: string
        lessonType:
          type: string
          enum: [CORE, RECOVERY, REINFORCE]
        skillName:
          type: string
        learningGoal:
          type: ["string", "null"]
        remember:
          type: ["string", "null"]
        workedExample:
          type: ["string", "null"]
        guidedPractice:
          type: ["string", "null"]
        independentPractice:
          type: ["string", "null"]
        studentMessage:
          type: ["string", "null"]
        teacherNote:
          description: >
            The note the teacher left on this day of the timetable, if any. It
            belongs to the class's day rather than to the lesson, so the same
            lesson taught to another class on another day carries a different
            one - and a lesson reached outside the timetable carries none.
          type: ["string", "null"]
        estimatedMinutes:
          type: ["integer", "null"]
        book:
          oneOf:
            - $ref: "#/components/schemas/BookReference"
            - type: "null"
      required:
        - id
        - lessonCode
        - lessonType
        - skillName
        - learningGoal
        - remember
        - workedExample
        - guidedPractice
        - independentPractice
        - studentMessage
        - teacherNote
        - estimatedMinutes
        - book
    StudentToday:
      type: object
      properties:
        date:
          description: Calendar date, YYYY-MM-DD. Not an instant, so not format:date.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        dateLabel:
          type: string
        className:
          type: string
        subjects:
          description: >
            One entry per subject the student has work in today. A child studies
            several subjects a day, so this is a list rather than a single
            lesson.
          type: array
          items:
            $ref: "#/components/schemas/SubjectDay"
        notice:
          type: string
      required: [date, dateLabel, className, subjects, notice]
    SubjectDay:
      type: object
      properties:
        subjectCode:
          type: string
        subjectName:
          type: string
        lesson:
          description: What the class is scheduled to study in this subject today.
          oneOf:
            - $ref: "#/components/schemas/DailyLessonView"
            - type: "null"
        extra:
          description: >
            Work assigned to this student personally in this subject. Where the
            class works through one book it is remediation on top; where the
            subject places students by level it is the whole of the day's work.
          oneOf:
            - $ref: "#/components/schemas/ExtraWork"
            - type: "null"
      required: [subjectCode, subjectName, lesson, extra]
    ScheduledDay:
      type: object
      properties:
        scheduledOn:
          description: Calendar date, YYYY-MM-DD.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isToday:
          type: boolean
        subjectId:
          description: >
            The subject this row's lesson belongs to, null on a day nothing is
            scheduled for. A day appears once per subject taught that day, so
            this is what tells two rows of the same date apart.
          type: ["integer", "null"]
        subject:
          type: ["string", "null"]
        lessonId:
          description: Null on a teaching day nothing is scheduled for yet.
          type: ["integer", "null"]
        lessonCode:
          type: ["string", "null"]
        lessonType:
          type: ["string", "null"]
        skillName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
      required:
        [scheduledOn, isToday, subjectId, subject, lessonId, lessonCode,
         lessonType, skillName, note]
    TeacherSchedule:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        gradeLevel:
          type: integer
        stage:
          type: string
          enum: [PRIMARY, SECONDARY]
          description: >
            Derived from the class's grade, not stored on the teacher: the two
            workflows differ per class, and one teacher may hold both.
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledDay"
      required: [classId, className, gradeLevel, stage, days]
    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
    AuthenticatedUser:
      type: object
      description: >
        Roles are a list: one account can hold TEACHER and ADMIN at once.
        studentId and teacherId are the linked core.students / core.teachers
        rows, null when the account has none.
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        studentId:
          type: ["integer", "null"]
        teacherId:
          type: ["integer", "null"]
        takesLessons:
          type: boolean
          description: >
            Whether this account actually takes any lesson anywhere. A class
            teacher who takes none of their class's subjects still sees the
            class, but the screens for entering things - the register, the
            review queue - have nothing in them for such an account, so the
            navigation leaves them out rather than offering a page that
            refuses.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
      required:
        - id
        - username
        - displayName
        - studentId
        - teacherId
        - takesLessons
        - roles
    SessionEnvelope:
      type: object
      properties:
