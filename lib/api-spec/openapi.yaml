          type: array
          items:
            $ref: "#/components/schemas/TeacherQuizAttemptRow"
      required: [classId, className, attempts]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          description: At least 8 characters. No composition rules - length is what matters.
          type: string
          minLength: 8
      required: [currentPassword, newPassword]
    BookReference:
      type: object
      description: Where in the book this lesson sits.
      properties:
        materialId:
          type: integer
        title:
          type: ["string", "null"]
        chapterTitle:
          type: ["string", "null"]
        pageFrom:
          type: ["integer", "null"]
        pageTo:
          type: ["integer", "null"]
        filePage:
          description: >
            Which page of the file to open at. Not the same as pageFrom: a
            scanned book carries covers and front matter the printed numbering
            does not count, so printed page 3 can be file page 9. The student
            is shown the printed numbers and the viewer opens the file page.
          type: ["integer", "null"]
        fileUrl:
          type: ["string", "null"]
      required: [materialId, title, chapterTitle, pageFrom, pageTo, filePage, fileUrl]
    DailyLessonView:
      type: object
      properties:
        id:
          type: integer
        lessonCode:
          type: string
        lessonType:
          type: string
          enum: [CORE, RECOVERY, REINFORCE]
        skillName:
          type: string
        learningGoal:
          type: ["string", "null"]
        remember:
          type: ["string", "null"]
        workedExample:
          type: ["string", "null"]
        guidedPractice:
          type: ["string", "null"]
        independentPractice:
          type: ["string", "null"]
        studentMessage:
          type: ["string", "null"]
        estimatedMinutes:
          type: ["integer", "null"]
        book:
          oneOf:
            - $ref: "#/components/schemas/BookReference"
            - type: "null"
      required:
        - id
        - lessonCode
        - lessonType
        - skillName
        - learningGoal
        - remember
        - workedExample
        - guidedPractice
        - independentPractice
        - studentMessage
        - estimatedMinutes
        - book
    StudentToday:
      type: object
      properties:
        date:
          description: Calendar date, YYYY-MM-DD. Not an instant, so not format:date.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        dateLabel:
          type: string
        className:
          type: string
        lesson:
          description: What the class is scheduled to study today. Null when nothing is.
          oneOf:
            - $ref: "#/components/schemas/DailyLessonView"
            - type: "null"
        extra:
          description: >
            Work assigned to this student personally. For a subject where the
            class works through one book it is remediation on top; for one
            placed by level it is the whole of the day's work.
          oneOf:
            - $ref: "#/components/schemas/ExtraWork"
            - type: "null"
        notice:
          type: string
      required: [date, dateLabel, className, lesson, extra, notice]
    ScheduledDay:
      type: object
      properties:
        scheduledOn:
          description: Calendar date, YYYY-MM-DD.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isToday:
          type: boolean
        lessonId:
          type: integer
        lessonCode:
          type: string
        lessonType:
          type: string
        skillName:
          type: string
        note:
          type: ["string", "null"]
      required: [scheduledOn, isToday, lessonId, lessonCode, lessonType, skillName, note]
    TeacherSchedule:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        gradeLevel:
          type: integer
        stage:
          type: string
          enum: [PRIMARY, SECONDARY]
          description: >
            Derived from the class's grade, not stored on the teacher: the two
            workflows differ per class, and one teacher may hold both.
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledDay"
      required: [classId, className, gradeLevel, stage, days]
