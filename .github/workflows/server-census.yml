# What is actually in the deployed database, counted without changing it.
#
# Before any data move there is one question that has to stop being a guess:
# what does the server already hold. This runs lib/db/scripts/census.mjs - row
# counts for every application table, with the data_origin breakdown - inside
# the release that is already on the host, and prints the result.
#
# Read only by construction: it starts one throwaway tools container, runs one
# script that issues SELECTs, and removes it. No service is stopped, no image
# is pulled, nothing is migrated or written. Take this before a restore and
# again after it; the two snapshots must agree.
name: Server database census (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ej-server-census
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: |
          set -eu
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST'; exit 1; }
          test -n "$SERVER_USER" || { echo 'Missing SERVER_USER'; exit 1; }
          test -n "$SERVER_SSH_PASSWORD" || { echo 'Missing SERVER_SSH_PASSWORD'; exit 1; }
          case "$SERVER_HOST" in *://*|*/*) echo 'SERVER_HOST must be a hostname or IP, without http:// or /'; exit 1;; esac

      - name: Count rows without changing anything
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ vars.SERVER_PORT || '22' }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          timeout: 30s
          command_timeout: 8m
          script: |
            set -eu
            deploy_root="$HOME/ej-learning"
            test -f "$deploy_root/server.env" || { echo 'No server.env: nothing is deployed here.'; exit 1; }

            # The release the host last deployed, by modification time. The
            # census script is the same in every release, so any of them would
            # do; the newest is simply the one whose compose file matches the
            # running containers.
            release_dir=$(ls -dt "$deploy_root"/releases/*/ 2>/dev/null | head -n 1)
            test -n "$release_dir" || { echo 'No release directory found.'; exit 1; }
            printf '\nRelease\n%s\n' "$release_dir"

            # compose.yml interpolates the image name, and the deploy passes
            # the registry prefix and the tag in the environment rather than in
            # server.env - so reading server.env alone leaves them unset and
            # Compose refuses to parse the file at all. release.sh records the
            # prefix on the host, and the release directory is named after the
            # tag that was deployed.
            EJ_IMAGE_PREFIX=$(cat "$deploy_root/image-prefix" 2>/dev/null || true)
            EJ_VERSION=$(basename "$release_dir")
            if [ -z "$EJ_IMAGE_PREFIX" ]; then
              # Failing that, whatever the running container was started from.
              image=$(docker inspect ej-learning-api-1 --format '{{.Config.Image}}' 2>/dev/null || true)
              test -n "$image" || { echo 'Cannot determine the image prefix.'; exit 1; }
              EJ_VERSION=${image##*:}
              without_tag=${image%:*}
              EJ_IMAGE_PREFIX=${without_tag%-api}
            fi
            export EJ_IMAGE_PREFIX EJ_VERSION
            printf 'Image %s-tools:%s\n' "$EJ_IMAGE_PREFIX" "$EJ_VERSION"

            # The base compose file only. The gateway overlay names the TMS
            # network that EJ web attaches to, which is a deployment concern
            # and is configured through a variable the deploy passes in - it
            # has nothing to do with counting rows, and including it made
            # Compose refuse to parse the stack on a host where that variable
            # is not set.
            compose="docker compose --project-name ej-learning --env-file $deploy_root/server.env -f ${release_dir}deploy/compose.yml"

            printf '\nContainers\n'
            $compose ps

            printf '\nMigrations applied\n'
            $compose exec -T db psql -U ej_owner -d ej_learning -tAc \
              'SELECT count(*) FROM drizzle.__drizzle_migrations'

            printf '\nLatest migrations\n'
            $compose exec -T db psql -U ej_owner -d ej_learning -c \
              "SELECT id, to_timestamp(created_at/1000)::date AS dated
                 FROM drizzle.__drizzle_migrations ORDER BY id DESC LIMIT 5"

            # Counted with SQL rather than with lib/db/scripts/census.mjs. The
            # script lives in the tools image, and the image on this host was
            # built from an older commit that does not carry it - so counting
            # through it would mean deploying first, which is the decision this
            # census exists to inform. psql is in the database image and needs
            # nothing built.
            printf '\nRow counts\n'
            $compose exec -T db psql -U ej_owner -d ej_learning -c \
              "SELECT n.nspname || '.' || c.relname AS \"table\",
                      (xpath('/row/c/text()',
                        query_to_xml(format('SELECT count(*) AS c FROM %I.%I',
                          n.nspname, c.relname), false, true, '')))[1]::text::bigint AS rows
                 FROM pg_class c
                 JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relkind = 'r'
                  AND n.nspname IN ('core','content','learning','assessment','staging','audit')
                ORDER BY rows DESC, 1"

            printf '\nWhere the people came from\n'
            $compose exec -T db psql -U ej_owner -d ej_learning -c \
              "SELECT 'students' AS who, data_origin::text AS origin, count(*) FROM core.students GROUP BY 2
               UNION ALL SELECT 'teachers', data_origin::text, count(*) FROM core.teachers GROUP BY 2
               UNION ALL SELECT 'classes', data_origin::text, count(*) FROM core.classes GROUP BY 2
               ORDER BY 1, 2"
